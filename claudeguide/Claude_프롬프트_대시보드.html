<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 프롬프트 라이브러리 · Chat · Cowork · Code</title>
<style>
  :root{
    --bg:#0f1113; --panel:#16191d; --panel2:#1c2026; --line:#2a2f36;
    --tx:#e8eaed; --tx2:#a3abb6; --tx3:#6f7885;
    --ac:#d4a27f; --ac2:#8fb8a8; --ac3:#8aa2c8;
    --code:#12151a;
  }
  [data-theme="light"]{
    --bg:#faf9f7; --panel:#ffffff; --panel2:#f2f0ec; --line:#e0ddd6;
    --tx:#1a1c1e; --tx2:#555d66; --tx3:#8a919a;
    --ac:#a8663a; --ac2:#3f6f5e; --ac3:#3c5a8a;
    --code:#f5f3ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.65;}
  header{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
    padding:14px 20px 12px;backdrop-filter:blur(8px)}
  .titlerow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:19px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--tx3);font-size:12.5px}
  .theme{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
    border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer}
  .theme:hover{color:var(--tx)}
  #q{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    border-radius:8px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit}
  #q:focus{border-color:var(--ac)}
  .filters{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .fgroup{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .flabel{color:var(--tx3);font-size:11.5px;margin-right:2px}
  .chip{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:99px;
    padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .chip:hover{color:var(--tx);border-color:var(--tx3)}
  .chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
  [data-theme="light"] .chip.on{color:#fff}
  .count{color:var(--tx3);font-size:12px;margin-left:auto}
  main{max-width:1080px;margin:0 auto;padding:22px 20px 80px}
  .grp{margin:30px 0 10px;font-size:13px;letter-spacing:.6px;color:var(--ac2);
    text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:7px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:15px 17px;margin-bottom:11px}
  .card:hover{border-color:var(--tx3)}
  .chead{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ac);
    background:var(--panel2);border-radius:4px;padding:2px 7px;flex-shrink:0;margin-top:2px}
  .ctitle{font-weight:650;font-size:15px;flex:1;letter-spacing:-.2px}
  .tags{display:flex;gap:5px;flex-shrink:0;margin-top:2px}
  .tag{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .arrow{color:var(--tx3);font-size:11px;flex-shrink:0;margin-top:4px;transition:transform .15s}
  .card.open .arrow{transform:rotate(90deg)}
  .when{color:var(--tx2);font-size:13.5px;margin-top:9px;padding-left:2px;border-left:2px solid var(--ac2);
    padding-left:10px}
  .body{display:none;margin-top:12px}
  .card.open .body{display:block}
  pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:13px 14px;
    overflow-x:auto;margin:0;font-size:12.8px;line-height:1.6;
    font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;white-space:pre-wrap;
    word-break:break-word;color:var(--tx)}
  .foot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .copy{background:var(--ac);border:none;color:#fff;border-radius:6px;padding:6px 15px;
    font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .copy:hover{filter:brightness(1.1)}
  .copy.done{background:var(--ac2)}
  .src{color:var(--tx3);font-size:11.5px;text-decoration:none;word-break:break-all}
  .src:hover{color:var(--ac3);text-decoration:underline}
  .empty{text-align:center;color:var(--tx3);padding:60px 0;font-size:14px}
  mark{background:rgba(212,162,127,.28);color:inherit;border-radius:2px;padding:0 1px}
  .toolbar{display:flex;gap:8px;margin:14px 0 0}
  .tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);border-radius:6px;
    padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
  .tbtn:hover{color:var(--tx)}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>Claude 프롬프트 라이브러리</h1>
    <span class="sub">Chat · Cowork · Code 141개 · 단위 프롬프트와 전체흐름 프롬프트</span>
    <button class="theme" onclick="toggleTheme()">◐ 테마</button>
  </div>
  <input id="q" placeholder="검색 — 예: 회의록, 리팩터링, 검증, 핸드오프, 체이닝, XML …" autocomplete="off">
  <div class="filters">
    <div class="fgroup"><span class="flabel">환경</span><span id="fenv"></span></div>
    <div class="fgroup"><span class="flabel">유형</span><span id="fkind"></span></div>
    <div class="fgroup"><span class="flabel">분류</span><span id="fgrp"></span></div>
    <span class="count" id="cnt"></span>
  </div>
  <div class="toolbar">
    <button class="tbtn" onclick="setAll(true)">전체 펼치기</button>
    <button class="tbtn" onclick="setAll(false)">전체 접기</button>
    <button class="tbtn" onclick="copyVisible()">보이는 것 모두 복사</button>
  </div>
</header>
<main id="out"></main>
<script>
const DATA = [{"id": "A-01", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 명확한 지시", "title": "'평범한 결과'를 '풀옵션 결과'로 끌어올리는 수식어", "when": "결과물이 밋밋하게 나올 때. Claude는 모호한 지시에서 '더 잘해달라'는 뜻을 추론하지 않는다.", "text": "Create an analytics dashboard. Include as many relevant features and interactions as possible. Go beyond the basics to create a fully-featured implementation.\n\n(한국어) [산출물]을 만들어줘. 관련 기능과 인터랙션을 가능한 한 많이 포함해줘. 기본 수준을 넘어서 완전한 구현으로 만들어줘.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-02", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 이유 제공", "title": "금지어만 던지지 말고 '왜'를 붙이기", "when": "규칙을 줬는데 엉뚱한 상황까지 일반화하거나, 반대로 지키지 않을 때.", "text": "Your response will be read aloud by a text-to-speech engine, so never use ellipses since the text-to-speech engine will not know how to pronounce them.\n\n(패턴) [제약]. 왜냐하면 [이유]. 그러니 [행동]해줘.\n※ 나쁜 예: \"NEVER use ellipses\" — 이유가 없으면 Claude가 일반화하지 못한다.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-03", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 예시(few-shot)", "title": "출력 포맷·톤을 고정하는 예시 3~5개", "when": "포맷/톤/구조를 반복 재현해야 할 때. 공식 문서가 '가장 신뢰할 수 있는 조종 수단'으로 꼽음.", "text": "<examples>\n<example>\n[예시 1 — 실제 use case 그대로]\n</example>\n<example>\n[예시 2 — 다른 각도]\n</example>\n<example>\n[예시 3 — 엣지 케이스]\n</example>\n</examples>\n\n위 예시와 동일한 형식·톤·구조로 다음을 처리해줘: {{INPUT}}\n\n※ 개수는 3~5개. 관련성(Relevant) · 다양성(Diverse, 엣지케이스 포함) · 태그 구조화(Structured) 3원칙.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-04", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · XML 구조화", "title": "지시 + 맥락 + 입력을 태그로 분리하는 기본 골격", "when": "프롬프트가 길어져 '지시'와 '자료'가 섞이기 시작할 때. 한국어에서도 그대로 작동한다.", "text": "<instructions>\n[무엇을 할지 — 동사로 시작하는 명령문]\n</instructions>\n\n<context>\n[배경 · 제약 · 독자 · 목적]\n</context>\n\n<input>\n{{자료 또는 사용자 입력}}\n</input>\n\n<output_format>\n[결과물 형식 — 항목, 길이, 표/산문 여부]\n</output_format>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-05", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · XML 구조화", "title": "한국어권에서 검증된 6블록 구조 (역할→목표→배경→입력→출력형식→검수기준)", "when": "사내 표준 프롬프트를 만들 때. 같은 골격으로 회의록·블로그·고객응대 3종이 모두 작동한 사례.", "text": "<역할>\n너는 [직무/전문성]이다.\n</역할>\n\n<목표>\n[이 작업이 달성해야 할 단 하나의 결과]\n</목표>\n\n<배경>\n[독자, 사용 맥락, 회사 톤, 하지 말아야 할 것]\n</배경>\n\n<입력>\n{{자료}}\n</입력>\n\n<출력형식>\n1. [항목]\n2. [항목]\n3. [항목]\n</출력형식>\n\n<검수기준>\n- 자료에 없는 사실은 쓰지 말 것. 필요하면 '확인 필요'로 표시.\n- [기준2]\n</검수기준>", "src": "https://potato-ai.xyz/claude-prompt-structure-xml-examples-workflow/"}, {"id": "A-06", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 역할 부여", "title": "한 문장짜리 역할 지정", "when": "도메인 톤·판단 기준을 고정하고 싶을 때. 공식 문서: '한 문장만으로도 차이가 난다.'", "text": "You are a helpful coding assistant specializing in Python.\n\n(한국어 확장형)\n당신은 10년 경력의 [직무]입니다.\n[기본 원칙]\n- [원칙 1 — 무엇을 우선하는가]\n- [원칙 2 — 어떤 표현을 피하는가]\n- [원칙 3 — 답변 전에 무엇을 확인하는가]", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-07", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 긴 문서 처리", "title": "20k 토큰 이상 자료는 '위'에, 질문은 '아래'에", "when": "장문 문서·다중 파일을 넣을 때. 공식 테스트 기준 최대 30% 품질 차이.", "text": "<documents>\n  <document index=\"1\">\n    <source>annual_report_2023.pdf</source>\n    <document_content>\n      {{ANNUAL_REPORT}}\n    </document_content>\n  </document>\n  <document index=\"2\">\n    <source>competitor_analysis_q2.xlsx</source>\n    <document_content>\n      {{COMPETITOR_ANALYSIS}}\n    </document_content>\n  </document>\n</documents>\n\nAnalyze the annual report and competitor analysis. Identify strategic advantages and recommend Q3 focus areas.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-08", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 긴 문서 처리", "title": "인용 먼저 → 판단 나중 (환각 차단용 그라운딩)", "when": "사실관계가 중요한 문서 분석. 근거 문장을 먼저 뽑게 하면 지어내기가 급감한다.", "text": "Find quotes from the documents that are relevant to {{질문}}. Place these in <quotes> tags. Then, based on these quotes only, write your analysis. Place it in <analysis> tags.\n\nIf the documents do not contain enough information to answer, say so explicitly instead of inferring.\n\n(한국어) 먼저 {{질문}}과 관련된 문장을 원문 그대로 <quotes> 태그 안에 인용해. 그다음 그 인용문에만 근거해서 분석을 <analysis> 태그 안에 써. 자료가 부족하면 추론하지 말고 부족하다고 명시해.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-09", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 사고 제어", "title": "도구 호출 후 반성하며 진행하게 하기", "when": "에이전트가 검색/파일 읽기 결과를 그냥 흘려보내고 다음 행동으로 넘어갈 때.", "text": "After receiving tool results, carefully reflect on their quality and determine optimal next steps before proceeding. Use your thinking to plan and iterate based on this new information, and then take the best next action.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-10", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 사고 제어", "title": "과사고(overthinking) 억제", "when": "간단한 질문에도 장황하게 생각하며 느려질 때.", "text": "Thinking adds latency and should only be used when it will meaningfully improve answer quality - typically for problems that require multistep reasoning. When in doubt, respond directly.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-11", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 사고 제어", "title": "결정 번복 방지 — 하나 골라서 끝까지", "when": "접근법을 계속 바꾸며 제자리걸음할 때.", "text": "When you're deciding how to approach a problem, choose an approach and commit to it. Avoid revisiting decisions unless you encounter new information that directly contradicts your reasoning. If you're weighing two approaches, pick one and see it through. You can always course-correct later if the chosen approach fails.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-12", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 출력 포맷", "title": "불릿 남발 끄고 산문으로 쓰게 하기", "when": "보고서·기고문처럼 '읽히는 글'이 필요한데 개조식 불릿만 나올 때.", "text": "<avoid_excessive_markdown_and_bullet_points>\nWhen writing reports, documents, technical explanations, analyses, or any long-form content, write in clear, flowing prose using complete paragraphs and sentences. Use standard paragraph breaks for organization and reserve markdown primarily for `inline code`, code blocks, and simple headings (## and ###). Avoid using **bold** and *italics*.\n\nDO NOT use ordered lists (1. ...) or unordered lists (*) unless: a) you're presenting truly discrete items where a list format is the best option, or b) the user explicitly requests a list or ranking.\n\nInstead of listing items with bullets or numbers, incorporate them naturally into sentences. NEVER output a series of overly short bullet points.\n</avoid_excessive_markdown_and_bullet_points>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-13", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 출력 포맷", "title": "서두(preamble) 제거 — prefill 폐기 이후의 대체법", "when": "'다음은 ...입니다' 같은 군더더기 도입부를 없애고 싶을 때.", "text": "Respond directly without preamble. Do not start with phrases like 'Here is...', 'Based on...', etc.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-14", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 출력 포맷", "title": "수식을 LaTeX 없이 평문으로", "when": "한글 문서·메일에 붙여넣을 때 \\frac{}{} 같은 마크업이 깨져 보일 때.", "text": "Format your response in plain text only. Do not use LaTeX, MathJax, or any markup notation such as \\( \\), $, or \\frac{}{}. Write all math expressions using standard text characters (e.g., \"/\" for division, \"*\" for multiplication, and \"^\" for exponents).", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-15", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 실행 강도", "title": "제안이 아니라 실제로 고치게 하기", "when": "'개선안을 제안해줘'라고 했더니 말만 하고 파일을 안 고칠 때.", "text": "<default_to_action>\nBy default, implement changes rather than only suggesting them. If the user's intent is unclear, infer the most useful likely action and proceed, using tools to discover any missing details instead of guessing. Try to infer the user's intent about whether a tool call (e.g., file edit or read) is intended or not, and act accordingly.\n</default_to_action>\n\n※ 반대로 함부로 고치지 못하게 하려면 <do_not_act_before_instructions> 버전을 쓴다.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-16", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 실행 강도", "title": "함부로 실행하지 못하게 막기 (보수 모드)", "when": "탐색·조사 단계인데 Claude가 성급하게 파일을 수정할 때.", "text": "<do_not_act_before_instructions>\nDo not jump into implementation or change files unless clearly instructed to make changes. When the user's intent is ambiguous, default to providing information, doing research, and providing recommendations rather than taking action. Only proceed with edits, modifications, or implementations when the user explicitly requests them.\n</do_not_act_before_instructions>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-17", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 속도", "title": "병렬 도구 호출 강제 (체감 속도 최대 90% 개선)", "when": "파일 여러 개 읽기·검색 여러 건처럼 서로 독립적인 작업이 순차 실행될 때.", "text": "<use_parallel_tool_calls>\nIf you intend to call multiple tools and there are no dependencies between the tool calls, make all of the independent tool calls in parallel. Prioritize calling tools simultaneously whenever the actions can be done in parallel rather than sequentially. For example, when reading 3 files, run 3 tool calls in parallel to read all 3 files into context at the same time. Maximize use of parallel tool calls where possible to increase speed and efficiency. However, if some tool calls depend on previous calls to inform dependent values like the parameters, do NOT call these tools in parallel and instead call them sequentially. Never use placeholders or guess missing parameters in tool calls.\n</use_parallel_tool_calls>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-18", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 분량 제어", "title": "간결성 지시 (Opus 5는 기본 응답이 길다)", "when": "답이 너무 길 때. effort를 낮춰도 가시 응답 길이는 안 줄어들므로 명시해야 한다.", "text": "Keep responses focused, brief, and concise. Keep disclaimers and caveats short, and spend most of the response on the main answer. When asked to explain something, give a high-level summary unless an in-depth explanation is specifically requested.\n\n※ 긴 시스템 프롬프트라면 맨 끝에 리마인더를 한 번 더:\n<tone_preference>\nKeep outputs reasonably concise.\n</tone_preference>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5"}, {"id": "A-19", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 분량 제어", "title": "문서 산출물의 분량을 과제에 맞추기", "when": "보고서에 채우기용 요약·상투 문구가 붙을 때.", "text": "Match the length of written documents to what the task needs: cover the substance, but do not pad with filler sections, redundant summaries, or boilerplate.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5"}, {"id": "A-20", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 범위 고정", "title": "시킨 만큼만, 그러나 끝까지", "when": "범위를 조용히 줄이거나 반대로 부풀릴 때.", "text": "Deliver what was asked, at the scope intended. Make routine judgment calls yourself, and check in only when different readings of the request would lead to materially different work. If the request seems mistaken or a better approach exists, say so in a sentence and continue with the task as asked rather than quietly narrowing, widening, or transforming it. Finish the whole task, and stop short of actions that are clearly beyond what was asked.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5"}, {"id": "A-21", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 안전", "title": "되돌릴 수 없는 행동은 물어보게 하기", "when": "파일 삭제·강제 푸시·공유 시스템 변경이 섞인 자율 작업을 맡길 때. 무인 실행의 필수 가드레일.", "text": "Consider the reversibility and potential impact of your actions. You are encouraged to take local, reversible actions like editing files or running tests, but for actions that are hard to reverse, affect shared systems, or could be destructive, ask the user before proceeding.\n\nExamples of actions that warrant confirmation:\n- Destructive operations: deleting files or branches, dropping database tables, rm -rf\n- Hard to reverse operations: git push --force, git reset --hard, amending published commits\n- Operations visible to others: pushing code, commenting on PRs/issues, sending messages, modifying shared infrastructure\n\nWhen encountering obstacles, do not use destructive actions as a shortcut.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-22", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 환각 방지", "title": "열어보지 않은 것에 대해 말하지 않기", "when": "파일·문서를 읽지 않고 그럴듯하게 답할 때.", "text": "<investigate_before_answering>\nNever speculate about code you have not opened. If the user references a specific file, you MUST read the file before answering. Make sure to investigate and read relevant files BEFORE answering questions about the codebase. Never make any claims about code before investigating unless you are certain of the correct answer - give grounded and hallucination-free answers.\n</investigate_before_answering>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-23", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 장시간 작업", "title": "토큰 걱정으로 조기 종료하지 않게 하기", "when": "긴 작업 중간에 '컨텍스트가 부족해서 여기서 마칩니다'로 끝나버릴 때.", "text": "Your context window will be automatically compacted as it approaches its limit, allowing you to continue working indefinitely from where you left off. Therefore, do not stop tasks early due to token budget concerns. As you approach your token budget limit, save your current progress and state to memory before the context window refreshes. Always be as persistent and autonomous as possible and complete tasks fully, even if the end of your budget is approaching. Never artificially stop any task early regardless of the context remaining.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-24", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 리서치", "title": "복잡한 리서치를 체계화하는 한 문단", "when": "조사 범위가 넓고 근거의 신뢰도가 중요한 작업 앞에 붙인다.", "text": "Search for this information in a structured way. As you gather data, develop several competing hypotheses. Track your confidence levels in your progress notes to improve calibration. Regularly self-critique your approach and plan. Update a hypothesis tree or research notes file to persist information and provide transparency. Break down this complex research task systematically.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"}, {"id": "A-25", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 위임 제어", "title": "서브에이전트 남발 억제 (Opus 5는 위임을 너무 쉽게 한다)", "when": "간단한 일까지 에이전트를 띄워 비용이 튈 때. 멀티에이전트는 일반 대화의 약 15배 토큰을 쓴다.", "text": "Delegate to a subagent only for large tasks that are genuinely independent and parallelizable, such as a wide multi-file investigation. Do not delegate work you can finish yourself in a handful of tool calls, and do not use subagents to verify or double-check your own work. If one subagent can complete the task, use one rather than several, and keep spawn counts low.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5"}, {"id": "A-26", "env": "공통", "kind": "단위", "cat": "A. 기반문법 · 메타", "title": "프롬프트를 개선하게 하는 프롬프트 (공식 개선기 5단계)", "when": "반복 사용할 프롬프트를 자산으로 다듬을 때. 분류 정확도 30% 향상이 보고된 절차.", "text": "아래 프롬프트를 개선해줘. 다음 5가지를 순서대로 적용해.\n\n<original_prompt>\n{{기존 프롬프트}}\n</original_prompt>\n\n1. 답변 전에 단계적으로 생각할 전용 섹션을 추가해라.\n2. 예시가 있으면 XML 태그로 표준화해라. 없으면 3~5개를 새로 만들어라. 예시는 관련성 있고, 다양하고(엣지케이스 포함), 태그로 감싸야 한다.\n3. 각 예시에 \"왜 그 답이 나오는지\" 추론 과정을 덧붙여라.\n4. 모호한 표현, 문법 오류, 구조 문제를 고쳐라. \"하지 마라\"는 금지형 대신 \"무엇을 하라\"는 지시형으로 바꿔라.\n5. 출력 형식을 강제할 방법을 제안해라.\n\n개선본을 내놓기 전에, 무엇을 왜 바꿨는지 항목별로 먼저 설명해줘.", "src": "https://claude.com/blog/prompt-improver"}, {"id": "B-01", "env": "Chat", "kind": "단위", "cat": "B. Chat · 글쓰기", "title": "퇴고 3조건 (문장길이·수동태·용어)", "when": "초안은 있는데 문장이 늘어지고 번역투일 때.", "text": "아래 글을 퇴고해줘. 조건: 한 문장 40자 이내, 수동태 제거, 전문 용어는 괄호로 뜻 풀이.\n\n{{원문}}", "src": "https://community.linkareer.com/employment_data/6142510"}, {"id": "B-02", "env": "Chat", "kind": "단위", "cat": "B. Chat · 글쓰기", "title": "2단계 첨삭 (논리 → 표현)", "when": "한 번에 다 고치라고 하면 논리 손질이 표현 손질에 묻힐 때.", "text": "아래 글을 2단계로 첨삭해줘.\n1단계: 논리 흐름·핵심 메시지 점검 — 무엇이 빠졌고 무엇이 순서가 틀렸는지만 지적. 아직 고치지 마.\n2단계: 내가 1단계에 동의하면, 번역투·클리셰를 교정한 최종본을 써줘.\n\n{{원문}}", "src": "https://community.linkareer.com/employment_data/6142510"}, {"id": "B-03", "env": "Chat", "kind": "단위", "cat": "B. Chat · 요약", "title": "회의록 → 실행 체크리스트 (추측 금지 조항 포함)", "when": "회의록에서 '이번 주에 바로 할 일'만 뽑아야 할 때. 담당자·일정 환각을 막는 마지막 줄이 핵심.", "text": "아래 회의록을 읽고 실행 체크리스트로 정리해줘.\n목적: 이번 주에 바로 처리할 일을 찾는 것.\n출력 형식:\n1. 한 문장 결론\n2. 결정된 사항\n3. 바로 할 일\n4. 담당자나 일정이 확인되지 않은 항목\n5. 다음 회의에서 물어볼 질문\n\n자료에 없는 담당자, 일정, 숫자는 추측하지 말고 '확인 필요'로 표시해줘.\n\n{{회의록}}", "src": "https://potato-ai.xyz/claude-action-checklist-long-doc-workflow/"}, {"id": "B-04", "env": "Chat", "kind": "단위", "cat": "B. Chat · 요약", "title": "고객 피드백 → 제품 개선 항목", "when": "흩어진 VOC를 개선 과제로 압축할 때.", "text": "아래 고객 피드백을 제품 페이지 개선에 쓸 수 있게 정리해줘. 먼저 반복해서 나오는 불만을 5개 이하로 묶어줘. 그다음 각 불만마다 1. 사용자가 헷갈린 지점, 2. 페이지에서 고칠 문장, 3. 추가 확인이 필요한 근거를 나눠줘. 과장된 표현은 피하고, 원문에 없는 기능은 만들지 마.\n\n{{피드백 모음}}", "src": "https://potato-ai.xyz/claude-action-checklist-long-doc-workflow/"}, {"id": "B-05", "env": "Chat", "kind": "단위", "cat": "B. Chat · 요약", "title": "자료 → 초보자용 글 구조", "when": "전문 자료를 대중용 콘텐츠로 옮길 때.", "text": "아래 자료를 초보자용 블로그 글 흐름으로 바꿔줘. 결과는 1. 제목 후보 5개, 2. TL;DR, 3. 핵심 3줄 요약, 4. 본문 H2 구성, 5. 자주 묻는 질문, 6. 출처 확인이 필요한 문장 순서로 정리해줘. 표는 쓰지 말고 짧은 문단과 목록으로 풀어줘.\n\n{{자료}}", "src": "https://potato-ai.xyz/claude-action-checklist-long-doc-workflow/"}, {"id": "B-06", "env": "Chat", "kind": "단위", "cat": "B. Chat · 의사결정", "title": "가상 전문가 4인 패널로 다관점 검토", "when": "혼자 판단하기 어려운 기획·투자·조직 결정. 관점이 섞이지 않게 역할을 분리하는 게 핵심.", "text": "질문에 답할 때, 당신은 4명의 가상 전문가로 구성된 팀을 만들어주세요:\n- 데이터 분석가 (객관적 데이터와 수치)\n- 창의적 전략가 (혁신적 관점)\n- 비판적 평가자 (문제점과 리스크 지적)\n- 실무 전문가 (현실적 적용 가능성)\n\n각자 독립적으로 의견을 낸 뒤, 마지막에 네 의견이 충돌하는 지점을 먼저 정리하고 그다음 종합 결론을 내려줘.\n\n질문: {{질문}}", "src": "https://www.gotai.co.kr/%ED%81%B4%EB%A1%9C%EB%93%9C-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8/"}, {"id": "B-07", "env": "Chat", "kind": "단위", "cat": "B. Chat · 학습", "title": "소크라테스식 튜터", "when": "개념을 '아는 것 같은' 상태에서 실제로 아는 상태로 넘어갈 때.", "text": "{{주제}}에 대한 소크라테스식 튜터가 되어줘. 규칙:\n1) 내가 먼저 설명하면 논리적 빈틈을 찾아 질문한다\n2) 내 답변에 반례나 엣지 케이스를 제시한다\n3) 최종적으로 개선된 이해도를 요약한다\n\n정답을 먼저 알려주지 마. 내가 스스로 도달하게 해줘.", "src": "https://gongbuhow.com/genai/prompts/study-prompts/"}, {"id": "B-08", "env": "Chat", "kind": "단위", "cat": "B. Chat · 학습", "title": "자료 → 문제 세트 생성", "when": "교육자료·매뉴얼의 이해도를 점검할 문항이 필요할 때.", "text": "{{주제}}에 대해 다음 형식의 문제를 생성해줘:\n- 기초 이해 확인 문제 5개\n- 응용/분석 문제 5개\n- 실제 시나리오 기반 문제 3개\n- 오답 함정이 있는 객관식 5개\n\n각 문제마다 정답과 '왜 다른 선택지가 틀렸는지'를 함께 달아줘.", "src": "https://gongbuhow.com/genai/prompts/study-prompts/"}, {"id": "B-09", "env": "Chat", "kind": "단위", "cat": "B. Chat · 번역", "title": "비즈니스 번역 지침 (프로젝트 지침용)", "when": "같은 톤으로 반복 번역해야 할 때. Projects 지침에 넣어두면 매번 지정할 필요가 없다.", "text": "한국어를 영어로 번역하세요. 비즈니스 이메일에 적합한 격식체를 사용하세요. 한국어 고유 표현은 의역하되 괄호 안에 원문을 병기하세요. 문장당 20단어를 넘기지 마세요.", "src": "https://aijeong.com/%ED%81%B4%EB%A1%9C%EB%93%9C-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8-%EA%B8%B0%EB%8A%A5-%EC%82%AC%EC%9A%A9%EB%B2%95%EC%A7%80%EC%B9%A8%EC%84%A4%EC%A0%95-%EB%B0%8F-%EC%B6%94%EC%B2%9C/"}, {"id": "B-10", "env": "Chat", "kind": "단위", "cat": "B. Chat · Projects", "title": "Projects 지침 4요소 (말투·독자·형식·금지)", "when": "프로젝트 지침을 처음 쓸 때. 길게 쓰면 오히려 무시되므로 이 4가지만 짧게.", "text": "당신은 [분야] 전문 에디터입니다.\n- 모든 글은 [말투: 해요체/합쇼체]로 작성하세요.\n- 독자는 [독자]입니다.\n- 한 문단은 3~5문장으로 구성하세요. 소제목에는 ### 을 사용하세요.\n- 과장 표현(혁신적, 극대화, 완벽한 등)은 사용하지 마세요.\n- 글 마지막에 3줄 요약을 추가하세요.\n\n※ 운영 원칙: 지침은 길게 쓰지 말고 말투·독자·출력 형식·금지 사항 정도만 짧게 유지해야 관리가 쉽다.", "src": "https://potato-ai.xyz/claude-projects-long-document-workflow/"}, {"id": "B-11", "env": "Chat", "kind": "단위", "cat": "B. Chat · Projects", "title": "프로젝트 지식 정합성 점검", "when": "프로젝트에 문서가 쌓여 서로 모순되기 시작할 때. 주기적으로 돌리는 위생 프롬프트.", "text": "지금 이 프로젝트의 지식 파일들만 근거로 답해줘.\n1. 서로 충돌하는 서술이 있는 문서 쌍과 그 문장을 짚어줘.\n2. 날짜·수치가 오래돼 보이는 항목을 표시해줘.\n3. 어느 문서에도 답이 없는 '빈칸' 주제를 알려줘.\n추측하지 말고, 근거 문서명을 각 항목에 달아줘.", "src": "https://potato-ai.xyz/claude-projects-long-document-workflow/"}, {"id": "B-12", "env": "Chat", "kind": "단위", "cat": "B. Chat · Artifacts", "title": "Artifact 외부 공개 전 검수표", "when": "만든 아티팩트를 링크로 공유하기 직전. 실무에서 사고를 막아주는 프롬프트.", "text": "지금 만든 artifact를 외부 공개 링크로 공유하려고 합니다. 아래 기준으로 공개 전 검수표를 만들어 주세요.\n1. 외부인이 봐도 되는 정보\n2. 삭제해야 할 개인정보 또는 내부 정보\n3. 오래된 숫자, 날짜, 가격\n4. 오해를 줄 수 있는 문장\n5. 링크 공유 전에 직접 눌러 봐야 할 요소\n\n결과는 \"공개 가능\", \"수정 필요\", \"공개 금지\" 세 단계로 나눠 주세요.", "src": "https://potato-ai.xyz/claude-artifacts-share-publish-workflow/"}, {"id": "B-13", "env": "Chat", "kind": "단위", "cat": "B. Chat · Artifacts", "title": "내부용 아티팩트 → 공개용 사본 변환", "when": "실데이터가 든 산출물을 데모용으로 바꿔야 할 때.", "text": "현재 artifact를 공개용 사본으로 바꾸고 싶습니다. 아래 기준으로 수정해 주세요.\n- 고객명, 회사명, 이메일, 전화번호 제거\n- 내부 가격과 계약 조건 제거\n- 예시는 가상의 데이터로 변경\n- 첫 화면에 \"예시용 데모\"라고 표시\n- 외부인이 기능을 이해할 수 있도록 설명 보강", "src": "https://potato-ai.xyz/claude-artifacts-share-publish-workflow/"}, {"id": "B-14", "env": "Chat", "kind": "단위", "cat": "B. Chat · 스타일", "title": "내 글로 커스텀 스타일 학습시키기", "when": "Claude 답변이 '내 말투'가 아닐 때. 설정에서 Create & Edit Styles로 만든다.", "text": "아래는 내가 직접 쓴 글 3편이야. 이 글들에서 반복되는 특징을 추출해줘:\n- 문장 길이와 리듬\n- 자주 쓰는 접속 표현과 어미\n- 단락을 여는 방식과 닫는 방식\n- 절대 쓰지 않는 표현\n\n추출한 특징을 '스타일 지시문' 형태로 정리해줘. 그 지시문만 보고도 내 말투를 재현할 수 있어야 해.\n\n{{내 글 3편}}", "src": "https://news.aikoreacommunity.com/claude-3-conversation-styles-custom-update/"}, {"id": "C-01", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 파일·폴더 정리", "title": "폴더 정리 (계획 먼저 → 승인 후 실행)", "when": "다운로드·자료 폴더가 뒤엉켰을 때. '계획 먼저·삭제 확인' 두 조항이 사고를 막는다.", "text": "[폴더 경로]에 있는 파일을 주제별로 분류해줘. 중복은 해시로 찾고, 이미지는 1080px로 리사이즈, PDF는 압축. 작업 전에 계획을 먼저 보여주고, 삭제 전에는 목록 확인 받아. 삭제는 절대 자동 실행하지 마.", "src": "https://www.gpters.org/nocode/post/how-use-claude-cowork-0CdQIT9LWrd3Zbl"}, {"id": "C-02", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 파일·폴더 정리", "title": "파일 정리 3단 콤보 (관찰 → 제안 → 실행)", "when": "어떻게 정리할지 나도 모를 때. 한 번에 시키지 말고 세 번에 나눠 시키면 실패가 없다.", "text": "① 이 폴더 설명해 줘\n② 카테고리 추천해 줘\n③ 제안대로 파일 옮겨 줘\n\n※ ①에서 Claude가 파악한 내용이 틀렸으면 ②로 넘어가기 전에 바로잡는다. 이 지점이 전체 품질을 결정한다.", "src": "https://myip.co.kr/board/read.php?id=2090&table=tip"}, {"id": "C-03", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 엑셀·데이터", "title": "수식이 살아있는 엑셀 만들기", "when": "값만 박힌 표가 아니라 '고치면 자동으로 갱신되는' 시트가 필요할 때.", "text": "첨부한 데이터로 엑셀(.xlsx) 파일을 만들어줘.\n- 시트1: 원본 데이터 정리(불필요한 공백·중복 제거)\n- 시트2: [월별/카테고리별] 합계와 비중(%) 요약표\n- 합계·평균은 수식으로 넣어서 값이 바뀌면 자동 갱신되게 해줘\n- 요약표 옆에 막대 차트 하나 추가\n완성 파일을 주고, 어떤 수식을 어디에 썼는지 한 줄로 설명해줘.", "src": "https://aimatters.co.kr/ai-tool/43911/"}, {"id": "C-04", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 엑셀·데이터", "title": "CSV 분석 → 3시트 구조 (원본·요약·개선안)", "when": "데이터를 넘기면서 '사람이 검증할 수 있게' 만들어야 할 때.", "text": "첨부한 CSV를 분석해 엑셀 파일로 정리해주세요. 첫 번째 시트에는 원본 데이터를 유지하고, 두 번째 시트에는 [분류]별 성과 요약 표를 만들어주세요. 세 번째 시트에는 개선이 필요한 항목과 이유를 적어주세요. 계산식이 들어간 셀은 사람이 확인할 수 있도록 설명 열을 추가해주세요.", "src": "https://potato-ai.xyz/claude-file-creation-report-workflow/"}, {"id": "C-05", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 엑셀·데이터", "title": "영수증 이미지 → 경비정산 엑셀 (OCR + 환율)", "when": "영수증·명세 이미지가 폴더에 쌓여 있을 때.", "text": "[폴더 경로]의 영수증 이미지/PDF를 OCR로 읽어서 [회사 양식.xlsx] 형식으로 정리. 카테고리는 식비/교통비/숙박/기타로 분류. 외화는 [기준일] 환율로 원화 환산. 합계 수식 포함.\n\n읽지 못한 항목은 임의로 채우지 말고 '판독 불가' 행으로 따로 모아줘.", "src": "https://www.gpters.org/nocode/post/how-use-claude-cowork-0CdQIT9LWrd3Zbl"}, {"id": "C-06", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 보고서", "title": "산재된 노트 → 보고서 초안 (모순 표시 포함)", "when": "회의록·메일·메모가 폴더에 흩어져 있을 때. '모순 표시' 조항이 이 프롬프트의 값어치다.", "text": "[폴더]에 회의록·노트·이메일 발췌가 들어있어. [주제]에 대한 보고서 초안 만들어줘. 시간 순으로 정리하고, 자료 간 모순이 있으면 따로 표시해줘. [회사 톤] 유지하고 [목표 분량]자.", "src": "https://www.gpters.org/nocode/post/how-use-claude-cowork-0CdQIT9LWrd3Zbl"}, {"id": "C-07", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 보고서", "title": "복수 파일 → 주간 보고서 (숫자 근거 고정)", "when": "PDF·CSV를 함께 넘겨 보고서를 만들 때. 마지막 문장이 숫자 환각을 막는다.", "text": "첨부한 PDF는 [자료 A]이고, CSV는 [자료 B] 데이터입니다. [팀명] 주간 보고서 초안을 워드 문서 형태로 만들어주세요. 핵심 결론 3개, 주요 수치 표, 반복된 이슈, 다음 주 실행 항목 순서로 구성해주세요. 숫자는 CSV 기준으로 쓰고, 추정이 필요한 내용은 '확인 필요'로 표시해주세요.", "src": "https://potato-ai.xyz/claude-file-creation-report-workflow/"}, {"id": "C-08", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 보고서", "title": "장기 데이터 → 시각화 PDF 보고서", "when": "1년치 이상 거래·실적 데이터를 한 장짜리 그림으로 요약해야 할 때.", "text": "[파일 경로]의 [기간] 거래/이벤트 데이터를 분석해서 PDF 보고서 만들어줘. 카테고리별 합계 차트, 월간 추이, 상위 N개 항목, 이상치 자동 감지 포함. 한국어로.", "src": "https://www.gpters.org/nocode/post/how-use-claude-cowork-0CdQIT9LWrd3Zbl"}, {"id": "C-09", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 발표자료", "title": "보고서 → 7장 발표자료 (장별 역할 지정)", "when": "문서를 슬라이드로 옮길 때. 장별 역할을 못 박아야 '문서 복붙 슬라이드'가 안 나온다.", "text": "첨부한 보고서와 표를 바탕으로 7장짜리 발표자료 초안을 만들어주세요. 대상은 [청중]입니다. 1장은 결론, 2장은 배경, 3장은 핵심 수치, 4장은 문제점, 5장은 [현장 목소리], 6장은 제안, 7장은 다음 액션으로 구성해주세요. 각 슬라이드에는 제목, 핵심 문장, 발표자 메모를 넣어주세요.", "src": "https://potato-ai.xyz/claude-file-creation-report-workflow/"}, {"id": "C-10", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 발표자료", "title": "PPT 실패 회피 — 한 장 테스트 먼저", "when": "10장 넘는 덱을 한 번에 시키면 생성 도중 실패하는 문제를 우회할 때.", "text": "① 임의의 주제로 딱 한 장의 테스트 PPT만 먼저 만들어줘. 폰트·로고·비율·여백을 확인할게.\n② (승인 후) 같은 디자인 규칙으로 1~5장을 만들어줘.\n③ (승인 후) 같은 규칙으로 6~10장을 만들고 하나로 합쳐줘.\n\n디자인 규칙: 폰트는 [폰트명]만 사용 / 로고는 [파일] / 슬라이드 비율은 16:9만.", "src": "https://brunch.co.kr/@sonteady/103"}, {"id": "C-11", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 회의·메일", "title": "회의록 → 액션 아이템 + 발송 메일", "when": "회의 직후 5분 안에 후속 조치를 돌릴 때.", "text": "이 회의록에서 액션 아이템 추출해줘. 담당자·기한·산출물 3열 표로. 참석자에게 보낼 이메일 초안도 써줘. 회의록에 없는 담당자·기한은 비워두고 '미정'으로 표시해.", "src": "https://digit2sight.com/%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EC%9B%8C%ED%81%ACclaude-cowork-%EC%99%84%EB%B2%BD-%EA%B0%80%EC%9D%B4%EB%93%9C-%EA%B0%80%EA%B2%A9%C2%B7%EC%82%AC%EC%9A%A9%EB%B2%95%C2%B7%EC%8B%A4%EC%A0%84/"}, {"id": "C-12", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 회의·메일", "title": "받은편지함 5단 분류 (자동 삭제 금지)", "when": "메일이 쌓여 우선순위가 안 보일 때.", "text": "받은편지함을 분류해줘. (1) 즉시 답장 필요, (2) 24시간 내 답장, (3) 읽기만, (4) 보관, (5) 삭제 후보. 분류 기준은 [내 룰 5개]. 삭제는 절대 자동 실행하지 마. 분류 결과만 표로 보여줘.", "src": "https://www.gpters.org/nocode/post/how-use-claude-cowork-0CdQIT9LWrd3Zbl"}, {"id": "C-13", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 회의·메일", "title": "내 과거 메일 톤으로 새 메일 쓰기", "when": "거래처 대응 메일의 톤을 유지해야 할 때.", "text": "지난주에 보낸 이메일과 비슷한 톤으로 [상대]에게 [용건] 안내 메일 초안을 써 줘. 과거 메일에서 내가 실제로 쓴 인사말·맺음말 형식을 그대로 따라줘.", "src": "https://www.digitalmarketer.co.kr/insights/claude-cowork-5-ai-tasks-for-beginners"}, {"id": "C-14", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 리서치", "title": "경쟁사·제품 비교 보고서 자동 생성", "when": "여러 사이트를 돌며 표를 만들어야 할 때.", "text": "[대상 1·2·3] 공식 사이트를 탐색해서 가격·기능 비교 보고서 만들어줘. 각 항목마다 출처 URL과 확인 일자를 달아줘. 사이트에서 확인되지 않은 항목은 빈칸으로 두고 추정하지 마.", "src": "https://digit2sight.com/%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EC%9B%8C%ED%81%ACclaude-cowork-%EC%99%84%EB%B2%BD-%EA%B0%80%EC%9D%B4%EB%93%9C-%EA%B0%80%EA%B2%A9%C2%B7%EC%82%AC%EC%9A%A9%EB%B2%95%C2%B7%EC%8B%A4%EC%A0%84/"}, {"id": "C-15", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 리서치", "title": "링크 하나 → 3종 콘텐츠 동시 생산", "when": "같은 소스로 블로그·SNS·요약을 한 번에 뽑을 때.", "text": "이 링크 → 한국어 요약 + 블로그 글(3,000자) + 스레드 포스트(250자) 동시에 만들어줘. 세 결과물의 사실관계는 반드시 원문과 일치해야 하고, 원문에 없는 수치는 쓰지 마.", "src": "https://digit2sight.com/%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EC%9B%8C%ED%81%ACclaude-cowork-%EC%99%84%EB%B2%BD-%EA%B0%80%EC%9D%B4%EB%93%9C-%EA%B0%80%EA%B2%A9%C2%B7%EC%82%AC%EC%9A%A9%EB%B2%95%C2%B7%EC%8B%A4%EC%A0%84/"}, {"id": "C-16", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 문서 변환", "title": "폴더 안 PDF 전체 → 한 장 요약", "when": "논문·보고서 뭉치의 공통점을 뽑을 때.", "text": "이 폴더의 모든 PDF를 읽고 핵심 결론과 공통점을 한 페이지 요약으로 정리해 줘. 문서마다 결론이 갈리는 지점은 '이견'으로 따로 모아줘.", "src": "https://www.digitalmarketer.co.kr/insights/claude-cowork-5-ai-tasks-for-beginners"}, {"id": "C-17", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 예약 작업", "title": "매일 아침 브리핑 (토큰 절약형 — 영어 지시 + 한국어 출력)", "when": "반복 리서치를 자동화할 때. 지시는 영어로, 출력만 한국어로 하면 토큰이 절약된다.", "text": "You are a global tech researcher and news curator.\n\nEvery day at 9am: find the TOP 5 most important news in [분야] and save to [저장 위치].\n\nCover: [키워드 1, 2, 3]\nSelect news that covers: [선정 기준]\n\nOutput format:\n[뉴스 TOP 5 - YYYY.MM.DD]\n1️⃣ Title / Source / Summary (3-4 lines) / Why it matters / Insight\n— repeat for all 5 —\n📊 Today's trend summary (3 lines)\n🚀 Company to watch (1-2)\n\nRespond in Korean.", "src": "https://maily.so/makersnote/posts/8mo542j7z9p"}, {"id": "C-18", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 예약 작업", "title": "아침 업무 브리핑 (일정·메일·메시지 통합)", "when": "출근 전 30분에 하루 그림을 받고 싶을 때. /schedule 로 등록한다.", "text": "매일 오전 8시 30분에 다음을 정리해서 브리핑 문서로 만들어줘.\n1. 오늘 일정 — 시간 순, 준비물이 필요한 것 표시\n2. 어제 이후 온 중요 메일 — 답장 필요한 것만\n3. 미해결 액션 아이템 — 기한 임박 순\n\n문서는 [폴더]에 날짜_브리핑.md 로 저장해줘.", "src": "https://www.gpters.org/nocode/post/summary-how-use-claude-1s9HnCamgNA8tFZ"}, {"id": "C-19", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 스킬 만들기", "title": "방금 한 작업을 스킬로 역설계하기", "when": "같은 작업을 또 할 것 같을 때. 스킬을 만드는 가장 쉽고 확실한 방법.", "text": "지금까지의 과정을 스킬로 만들어줘.\n\n포함할 것:\n1. 이 스킬이 하는 일 (한 문장)\n2. 언제 발동해야 하는지 (사용자가 쓸 법한 표현 5개)\n3. 반드시 지켜야 할 규칙\n4. 톤앤매너\n5. 결과물 형태와 저장 위치\n\n방금 작업에서 내가 중간에 수정 요청한 부분은 '흔한 실수' 항목으로 따로 넣어줘.", "src": "https://www.aiground.co.kr/claude-cowork-beginners-guide/"}, {"id": "C-20", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 스킬 만들기", "title": "업무 스킬 요청 5요소 템플릿", "when": "처음부터 스킬을 설계할 때. 5요소를 다 채우면 실패율이 급감한다.", "text": "[스킬 이름] 스킬을 만들어줘.\n\n① 작업 정의: 우리는 [업종/맥락]이고, 이 스킬은 [무엇]을 한다.\n② 트리거 상황: [언제 이 스킬이 쓰여야 하는가 — 사용자 표현 예시 포함]\n③ 규칙·가이드: [반드시 지킬 것 / 절대 하지 말 것]\n④ 톤앤매너: [문체, 어휘 수준, 금지 표현]\n⑤ 결과물 형태: [파일 형식, 구조, 저장 위치]", "src": "https://blog.highoutputclub.com/claude-skills-for-non-developers/"}, {"id": "C-21", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 가드레일", "title": "파일 변경 전 확인 받기 (모든 Cowork 세션의 기본값)", "when": "로컬 폴더를 연결한 모든 작업. 폴더 지침(CLAUDE.md)에 넣어두면 매번 안 써도 된다.", "text": "파일 삭제/덮어쓰기 전에 변경 내용을 보여주고 확인 기다려줘.\n작업 전에 계획을 먼저 보여주고, 삭제 전에는 목록 확인 받아.\n삭제는 절대 자동 실행하지 마.", "src": "https://www.aiground.co.kr/claude-cowork-beginners-guide/"}, {"id": "C-22", "env": "Cowork", "kind": "단위", "cat": "C. Cowork · 가드레일", "title": "추측 금지 조항 (모든 문서 작업에 덧붙이는 한 줄)", "when": "담당자·일정·숫자를 지어내는 것을 막을 때. 실무에서 가장 효용이 큰 한 줄.", "text": "자료에 없는 담당자, 일정, 숫자는 추측하지 말고 '확인 필요'로 표시해줘.\n과장된 표현은 피하고, 원문에 없는 내용은 만들지 마.", "src": "https://potato-ai.xyz/claude-action-checklist-long-doc-workflow/"}, {"id": "D-01", "env": "Code", "kind": "단위", "cat": "D. Code · 코드 파악", "title": "코드베이스 전체 개요", "when": "처음 보는 저장소에 들어갈 때 첫 질문.", "text": "give me an overview of this codebase: architecture, key directories, and how the pieces connect\n\n(한국어) 이 코드베이스 개요를 줘: 아키텍처, 주요 디렉터리, 각 조각이 어떻게 연결되는지.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-02", "env": "Code", "kind": "단위", "cat": "D. Code · 코드 파악", "title": "특정 경로의 데이터 흐름 설명 + 산출물 지정", "when": "한 모듈을 이해해야 할 때. format 슬롯에 'HTML 다이어그램'을 넣으면 그림까지 나온다.", "text": "explain what {path} does and how data flows through it. write it up as {format}\n\n(예) explain what src/scheduler/queue.ts does and how data flows through it. write it up as an HTML page with a diagram, then open it in the browser.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-03", "env": "Code", "kind": "단위", "cat": "D. Code · 코드 파악", "title": "이 코드를 지우면 뭐가 깨지나", "when": "삭제·리팩터링 전 영향 범위 파악.", "text": "what would break if I deleted {target}?\n\n(한국어) {target}을 지우면 뭐가 깨질까? 호출 지점을 전부 찾아서 보여줘.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-04", "env": "Code", "kind": "단위", "cat": "D. Code · 코드 파악", "title": "이상한 API의 유래를 git 히스토리로 추적", "when": "'왜 이렇게 짜여 있지?'가 궁금할 때. 코드가 아니라 히스토리에 답이 있는 경우.", "text": "look through {target}'s git history and summarize how its api came to be\n\n(한국어) {target}의 git 히스토리를 훑어서 이 API가 어떻게 지금 모습이 됐는지 요약해줘.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-05", "env": "Code", "kind": "단위", "cat": "D. Code · 구현", "title": "기존 패턴을 지목해서 따라 만들게 하기", "when": "신규 기능이 기존 코드와 따로 놀지 않게 하려 할 때. 공식 문서의 대표 Before/After.", "text": "look at how existing widgets are implemented on the home page to understand the patterns. HotDogWidget.php is a good example. follow the pattern to implement a new calendar widget that lets the user select a month and paginate forwards/backwards to pick a year. build from scratch without libraries other than the ones already used in the codebase.\n\n(패턴) {기존 예시}가 어떻게 구현됐는지 보고 패턴을 이해한 다음, 같은 방식으로 {신규}를 만들어줘. 코드베이스에 이미 쓰는 라이브러리 외에는 쓰지 마.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-06", "env": "Code", "kind": "단위", "cat": "D. Code · 구현", "title": "검증 기준을 프롬프트에 심기 (가장 효과 큰 한 가지)", "when": "항상. 검증 수단이 없으면 '다 된 것 같다'가 유일한 완료 신호가 되고 사람이 검증 루프가 된다.", "text": "write a validateEmail function. example test cases: user@example.com is true, invalid is false, user@.com is false. run the tests after implementing\n\n(패턴) {기능}을 구현해줘. 예시 테스트 케이스: {입력1}→{기대1}, {입력2}→{기대2}. 구현한 뒤에 테스트를 실행해줘.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-07", "env": "Code", "kind": "단위", "cat": "D. Code · 구현", "title": "UI는 스크린샷으로 자기검증시키기", "when": "'더 예쁘게'처럼 주관적 지시를 객관적 루프로 바꿀 때.", "text": "[paste screenshot] implement this design. take a screenshot of the result and compare it to the original. list differences and fix them\n\n(한국어) [스크린샷 첨부] 이 디자인대로 구현해줘. 결과물 스크린샷을 찍어 원본과 비교하고, 차이점을 나열한 다음 고쳐줘.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-08", "env": "Code", "kind": "단위", "cat": "D. Code · 디버깅", "title": "증상이 아니라 근본 원인 (에러 원문 붙여넣기)", "when": "빌드·테스트 실패. 말로 설명하지 말고 로그 원문을 붙여넣는 것이 핵심.", "text": "the build fails with this error: [paste error]. fix it and verify the build succeeds. address the root cause, don't suppress the error", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-09", "env": "Code", "kind": "단위", "cat": "D. Code · 디버깅", "title": "버그 리포트 3요소 (증상 + 위치 힌트 + 완료 정의)", "when": "재현 가능한 버그를 맡길 때.", "text": "users report that login fails after session timeout. check the auth flow in src/auth/, especially token refresh. write a failing test that reproduces the issue, then fix it\n\n(패턴) {증상}이라는 제보가 있어. {경로}의 {영역}, 특히 {의심 지점}을 확인해줘. 이슈를 재현하는 실패 테스트를 먼저 작성한 다음 고쳐.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-10", "env": "Code", "kind": "단위", "cat": "D. Code · 디버깅", "title": "운영 장애 1차 진단", "when": "원인을 모르는 상태에서 조사 범위를 지정할 때.", "text": "{symptom}. check the logs, recent deploys, and config changes, then tell me the most likely cause\n\n(한국어) {증상}. 로그, 최근 배포, 설정 변경을 확인하고 가장 유력한 원인을 알려줘. 아직 고치지는 마.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-11", "env": "Code", "kind": "단위", "cat": "D. Code · 테스트", "title": "기존 테스트 패턴을 학습시킨 뒤 생성 (실무 효과 최대)", "when": "테스트 스타일이 제각각이 되는 걸 막을 때.", "text": "Read these existing test files to learn our testing patterns:\n- tests/services/user.service.test.ts\n- tests/services/project.service.test.ts\n\nNow generate tests for src/services/organization.service.ts.\nMatch the existing patterns exactly:\n- Same describe/it nesting structure\n- Same mock setup approach\n- Same assertion style\n- Same test naming convention\n- Same beforeEach/afterEach patterns\n\nCover: all public methods, error cases, edge cases, and any async behavior.\nDo not skip the unhappy paths.", "src": "https://developertoolkit.ai/en/claude-code/lessons/testing/"}, {"id": "D-12", "env": "Code", "kind": "단위", "cat": "D. Code · 테스트", "title": "커버리지 구멍만 골라 메우기", "when": "테스트를 무작정 늘리지 않고 미커버 경로만 칠 때.", "text": "Read {path} and the coverage report for it. Show me which lines and branches are not covered. Then write tests that cover the uncovered paths. Focus on: error handling branches, conditional logic tested for only one case, and async paths where the promise rejects.", "src": "https://developertoolkit.ai/en/claude-code/lessons/testing/"}, {"id": "D-13", "env": "Code", "kind": "단위", "cat": "D. Code · 테스트", "title": "테스트 통과용 하드코딩 방지", "when": "테스트만 통과하는 가짜 구현이 나올 때. 마지막 문단이 특히 중요하다.", "text": "Please write a high-quality, general-purpose solution using the standard tools available. Do not create helper scripts or workarounds to accomplish the task more efficiently. Implement a solution that works correctly for all valid inputs, not just the test cases. Do not hard-code values or create solutions that only work for specific test inputs.\n\nTests are there to verify correctness, not to define the solution.\n\nIf the task is unreasonable or infeasible, or if any of the tests are incorrect, please inform me rather than working around them.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-14", "env": "Code", "kind": "단위", "cat": "D. Code · 리뷰", "title": "커밋 전 위험 신호 점검", "when": "매일 쓰는 가장 짧은 리뷰 프롬프트.", "text": "review my uncommitted changes and flag anything that looks risky before I commit\n\n(한국어) 커밋 전에 내 uncommitted 변경사항을 리뷰하고 위험해 보이는 걸 지적해줘.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-15", "env": "Code", "kind": "단위", "cat": "D. Code · 리뷰", "title": "PR diff 시니어 관점 리뷰", "when": "브랜치를 올리기 전 자체 리뷰.", "text": "Review the diff between the current branch and main, and evaluate it from the perspective of a senior engineer. Output: numbered list, each item including [file:line], severity, and a concrete fix.", "src": "https://help.apiyi.com/en/claude-code-code-review-prompts-collection-guide-en.html"}, {"id": "D-16", "env": "Code", "kind": "단위", "cat": "D. Code · 리뷰", "title": "하위 호환성 파괴 점검", "when": "공개 API·라이브러리를 수정한 PR.", "text": "Review all changes in the current PR and check for backward-incompatible modifications: Have public API signatures or return values changed? Have required fields been added? Have default behaviors changed? List each with a migration note.", "src": "https://help.apiyi.com/en/claude-code-code-review-prompts-collection-guide-en.html"}, {"id": "D-17", "env": "Code", "kind": "단위", "cat": "D. Code · 보안", "title": "전체 보안 감사 7항목", "when": "배포 전 또는 인수인계 받은 코드의 1차 스크리닝.", "text": "Perform a security audit of this codebase. Check for: 1) SQL injection or NoSQL injection (string concatenation in queries), 2) XSS vulnerabilities (unsanitized user input rendered in HTML), 3) hardcoded secrets (API keys, passwords, JWT secrets in source files), 4) authentication bypasses (routes missing auth middleware), 5) insecure cryptography (MD5, SHA1 for passwords, weak random number generation), 6) missing security headers (CSP, HSTS, X-Frame-Options), 7) overly permissive CORS configuration. For each finding, show the file path, line number, severity (critical/high/medium/low), and a concrete fix.", "src": "https://developertoolkit.ai/en/claude-code/lessons/security-audit/"}, {"id": "D-18", "env": "Code", "kind": "단위", "cat": "D. Code · 보안", "title": "git 히스토리에 커밋된 시크릿 추적 + 재발 방지 훅", "when": "자격증명이 저장소에 들어갔을지 모를 때.", "text": "Search the entire git history for committed secrets: API keys, database connection strings, JWT secrets, private keys, AWS credentials. Check .env files that may have been committed, config files with hardcoded values, and test fixtures with real credentials. For each finding, tell me which commit introduced it and whether the secret is still valid. Then generate a .gitignore update and a pre-commit hook that blocks secret commits.", "src": "https://developertoolkit.ai/en/claude-code/lessons/security-audit/"}, {"id": "D-19", "env": "Code", "kind": "단위", "cat": "D. Code · 보안", "title": "발견 → 조치 계획 (작업량 기준 3분류)", "when": "감사 결과가 쏟아진 뒤 무엇부터 할지 정할 때.", "text": "From the security findings you just identified, create a prioritized remediation plan. Group fixes by effort (quick wins under 30 minutes, medium fixes under 2 hours, architectural changes). Start implementing the quick wins now.", "src": "https://developertoolkit.ai/en/claude-code/lessons/security-audit/"}, {"id": "D-20", "env": "Code", "kind": "단위", "cat": "D. Code · 성능", "title": "N+1·인덱스·SELECT * 일괄 점검", "when": "응답이 느린데 원인을 모를 때 가장 먼저 돌리는 프롬프트.", "text": "Analyze all database queries in our codebase. For each query: 1) identify if it is an N+1 pattern (query inside a loop or called once per item in a list), 2) check if the WHERE clause columns have indexes by looking at our migration files or schema, 3) flag any SELECT * that could be narrowed to specific columns, 4) find queries that fetch more rows than needed (missing LIMIT or pagination). For each problem, show the file location and provide the optimized version.", "src": "https://developertoolkit.ai/en/claude-code/lessons/performance/"}, {"id": "D-21", "env": "Code", "kind": "단위", "cat": "D. Code · 성능", "title": "느린 엔드포인트 실행 경로 프로파일링", "when": "특정 API 하나가 느릴 때.", "text": "Profile our {endpoint} endpoint. It currently takes {N} seconds. Trace the execution path from the route handler through every function it calls. For each function, estimate the time complexity based on the data structures used. Identify any: 1) nested loops over large arrays, 2) synchronous operations that should be async, 3) repeated computation that could be cached, 4) unnecessary data fetching.", "src": "https://developertoolkit.ai/en/claude-code/lessons/performance/"}, {"id": "D-22", "env": "Code", "kind": "단위", "cat": "D. Code · 성능", "title": "목표 수치를 명시한 최적화 지시", "when": "'빠르게 해줘'가 아니라 검증 가능한 목표를 줄 때.", "text": "optimize {target} to bring {metric} from {current} down to under {goal}. measure before and after, and show me the numbers.\n\n(한국어) {대상}을 최적화해서 {지표}를 {현재}에서 {목표} 미만으로 낮춰줘. 전후를 측정해서 숫자로 보여줘.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-23", "env": "Code", "kind": "단위", "cat": "D. Code · 리팩터링", "title": "행동 고정 테스트(characterization test) 먼저", "when": "레거시를 손대기 직전. 이걸 건너뛴 리팩터링은 사고가 난다.", "text": "Read {file} in full, then read its test file. Write characterization tests that lock in the CURRENT behavior of {function}, including the branches I am likely to break: {분기1}, {분기2}, {분기3}. Do not change the implementation yet.", "src": "https://developertoolkit.ai/en/claude-code/productivity-patterns/refactoring-patterns/"}, {"id": "D-24", "env": "Code", "kind": "단위", "cat": "D. Code · 리팩터링", "title": "비대한 서비스 분리 (파사드 유지로 PR 안전하게)", "when": "900줄짜리 God 클래스를 쪼갤 때. 파사드 조항이 PR을 작게 유지한다.", "text": "{file} has grown to ~{N} lines and mixes {관심사1}, {관심사2}, and {관심사3}. Plan a split into {ServiceA}, {ServiceB}, and {ServiceC}. Keep one thin facade that delegates, so external imports do not break in this PR. Plan first, then implement.", "src": "https://developertoolkit.ai/en/claude-code/productivity-patterns/refactoring-patterns/"}, {"id": "D-25", "env": "Code", "kind": "단위", "cat": "D. Code · 리팩터링", "title": "과잉 엔지니어링 억제 (Opus 4.5 이후 필수)", "when": "시킨 것보다 훨씬 많이 고쳐올 때. 구현 지시 앞에 붙인다.", "text": "Avoid over-engineering. Only make changes that are directly requested or clearly necessary. Keep solutions simple and focused:\n\n- Scope: Don't add features, refactor code, or make \"improvements\" beyond what was asked. A bug fix doesn't need surrounding code cleaned up.\n- Documentation: Don't add docstrings, comments, or type annotations to code you didn't change. Only add comments where the logic isn't self-evident.\n- Defensive coding: Don't add error handling, fallbacks, or validation for scenarios that can't happen. Only validate at system boundaries.\n- Abstractions: Don't create helpers, utilities, or abstractions for one-time operations. The right amount of complexity is the minimum needed for the current task.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-26", "env": "Code", "kind": "단위", "cat": "D. Code · 문서화", "title": "신규 개발자 첫날용 README 생성", "when": "인수인계·온보딩 문서가 없을 때.", "text": "Read the codebase and generate a README.md that a new developer needs on day one: what the project does, how to run it locally, how to run tests, the directory map, and the three things that most surprise newcomers.", "src": "https://developertoolkit.ai/en/claude-code/lessons/documentation/"}, {"id": "D-27", "env": "Code", "kind": "단위", "cat": "D. Code · 문서화", "title": "운영팀용 런북 생성", "when": "배포·장애 대응을 다른 사람이 할 수 있게 만들 때.", "text": "Generate a runbook for the operations team. They need to know: how to deploy and roll back, what to check when the service is down, which alerts mean what, how to rotate credentials, and who to escalate to. Write it so someone who has never touched this codebase can follow it at 3am.", "src": "https://developertoolkit.ai/en/claude-code/lessons/documentation/"}, {"id": "D-28", "env": "Code", "kind": "단위", "cat": "D. Code · Git", "title": "커밋 메시지 후보 3개 → 선택 → 커밋", "when": "커밋 메시지 품질을 일정하게 유지할 때. 슬래시 커맨드로 저장해 두면 좋다.", "text": "Analyze the staged diff and:\n1. Understand the nature and purpose of the changes\n2. Generate 3 commit message candidates (Conventional Commits format: feat:, fix:, docs:, refactor:)\n3. Select the most appropriate one and explain why\n4. Execute the commit with the selected message\n\nDo not add a co-authorship footer.", "src": "https://en.bioerrorlog.work/entry/git-commit-with-claude-code-custom-slash-command"}, {"id": "D-29", "env": "Code", "kind": "단위", "cat": "D. Code · Git", "title": "릴리스 노트 초안", "when": "태그 사이 변경을 사용자 언어로 옮길 때.", "text": "compare {from} to {to} and draft release notes grouped by feature, fix, and breaking change. Write each line for a user, not for a developer.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-30", "env": "Code", "kind": "단위", "cat": "D. Code · Git", "title": "머지 컨플릭트 해결 + 판단 근거 설명", "when": "양쪽 의도를 모두 살려야 할 때.", "text": "두 변경의 의도를 모두 살려서 자연스럽게 하나로 합쳐줘. 합치는 과정에서 판단이 필요한 부분이 있으면, 어떻게 합쳤는지를 코드 읽을 줄 모르는 사람도 알 수 있게 쉬운 말로 설명해주세요. 다 합친 뒤에는 양쪽 기능이 모두 정상 동작하는지 직접 테스트하고 깨진 게 있으면 수정해주세요.", "src": "https://brunch.co.kr/@yongjinjinipln/257"}, {"id": "D-31", "env": "Code", "kind": "단위", "cat": "D. Code · 궤도 수정", "title": "방향이 틀렸을 때 한 줄", "when": "결과가 어긋났을 때. 길게 설명하지 말고 이 형태로 끊는다.", "text": "that is not right: {feedback}. try a different approach\n\n(한국어) 그거 아니야: {무엇이 왜 틀렸는지}. 다른 접근을 시도해봐.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-32", "env": "Code", "kind": "단위", "cat": "D. Code · 궤도 수정", "title": "너무 많이 고쳤을 때 되감기", "when": "범위를 벗어난 변경이 섞여 들어왔을 때.", "text": "that is too much. keep only the changes to {scope} and undo your other edits\n\n(한국어) 너무 많이 했어. {범위}에 대한 변경만 남기고 나머지 수정은 되돌려.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-33", "env": "Code", "kind": "단위", "cat": "D. Code · 궤도 수정", "title": "같은 실수를 규칙으로 환류시키기", "when": "같은 지적을 두 번 했을 때. 세 번째는 하지 않게 만드는 프롬프트.", "text": "you keep {mistake}. add a rule to CLAUDE.md so this stops happening\n\n(한국어) 너 계속 {실수} 하잖아. 다시는 안 그러도록 CLAUDE.md에 규칙을 추가해.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-34", "env": "Code", "kind": "단위", "cat": "D. Code · 메타", "title": "세션 학습을 프로젝트 규칙으로 축적", "when": "세션 종료 직전. 이 한 줄이 다음 세션의 품질을 올린다.", "text": "summarize what we did this session and suggest what to add to CLAUDE.md\n\n(한국어) 이번 세션에서 한 일을 요약하고 CLAUDE.md에 추가할 것을 제안해줘. 이미 있는 규칙과 중복되면 제안하지 마.", "src": "https://code.claude.com/docs/en/prompt-library"}, {"id": "D-35", "env": "Code", "kind": "단위", "cat": "D. Code · 메타", "title": "모르는 CLI 도구를 스스로 익히게 하기", "when": "MCP를 붙이기 전에 먼저 시도할 것. CLI가 MCP보다 컨텍스트 효율이 좋다.", "text": "Use '{foo-cli-tool} --help' to learn about the tool, then use it to solve A, B, C.\n\n(한국어) '{도구} --help'로 이 도구를 익힌 다음, 그걸로 A, B, C를 해결해줘.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "D-36", "env": "Code", "kind": "단위", "cat": "D. Code · 메타", "title": "훅을 작성하게 하기", "when": "'매번 반드시' 일어나야 하는 일이 있을 때. CLAUDE.md는 권고, 훅은 강제다.", "text": "Write a hook that runs eslint after every file edit.\nWrite a hook that blocks writes to the migrations folder.\n\n(한국어) 파일 편집마다 eslint를 실행하는 훅을 작성해줘. / migrations 폴더에 대한 쓰기를 막는 훅을 작성해줘.", "src": "https://code.claude.com/docs/en/hooks-guide"}, {"id": "E-01", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 요구사항 확정", "title": "★ 인터뷰 → SPEC.md → 새 세션에서 실행", "when": "큰 작업의 시작점. 공식 문서가 템플릿까지 제공하는데 가장 덜 알려진 패턴. '명세에 쓴 시간이 구현을 지켜보는 시간보다 더 큰 보상을 준다.'", "text": "[1단계 — 인터뷰]\nI want to build [brief description]. Interview me in detail using the AskUserQuestion tool.\n\nAsk about technical implementation, UI/UX, edge cases, concerns, and tradeoffs. Don't ask obvious questions, dig into the hard parts I might not have considered.\n\nKeep interviewing until we've covered everything, then write a complete spec to SPEC.md.\n\n(한국어) 나는 [한 줄 설명]을 만들려고 해. 나를 자세히 인터뷰해줘. 기술 구현, UI/UX, 엣지케이스, 우려사항, 트레이드오프를 물어봐. 뻔한 질문은 하지 마. 내가 미처 생각 못 했을 어려운 지점을 파고들어. 전부 다룰 때까지 계속 인터뷰하고, 끝나면 완성된 명세를 SPEC.md에 써줘.\n\n[2단계 — 반드시 새 세션에서]\nSPEC.md 를 읽고 구현해줘. 이 대화 이전의 맥락은 없다고 가정해.\n\n※ 좋은 명세의 조건(공식): ① 관련 파일과 인터페이스를 이름으로 지목 ② 무엇이 범위 밖인지 명시 ③ 기능이 실제 동작함을 증명하는 end-to-end 검증 단계로 끝날 것.\n※ 개수를 고정(\"질문 5개만 해줘\")하면 뻔한 질문으로 채우게 된다. \"다 다룰 때까지\"가 공식 권장.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "E-02", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 개발 4단계", "title": "★ Explore → Plan → Code → Commit (공식 4단계)", "when": "범위가 불확실한 기능 개발. 반대로 'diff를 한 문장으로 설명할 수 있으면 계획 단계를 건너뛰라'가 공식 지침.", "text": "[1 Explore]  ※ Shift+Tab 으로 plan mode 진입\nread /src/auth and understand how we handle sessions and login.\nalso look at how we manage environment variables for secrets.\n\n[2 Plan]  ※ Ctrl+G 로 계획을 에디터에서 직접 수정 가능\nI want to add Google OAuth. What files need to change?\nWhat's the session flow? Create a plan.\n\n[3 Implement]  ※ plan mode 해제\nimplement the OAuth flow from your plan. write tests for the\ncallback handler, run the test suite and fix any failures.\n\n[4 Commit]\ncommit with a descriptive message and open a PR", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "E-03", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · TDD", "title": "TDD 3단 루프 (RED → GREEN → REFACTOR)", "when": "요구사항이 명확하고 정답이 검증 가능한 로직. 각 단계를 반드시 끊어서 시켜야 한다.", "text": "[RED — 테스트만]\nWrite a test for {함수}.\nRequirements:\n- {입출력 계약}\n- {예외 조건 1}\n- {예외 조건 2}\n- Do NOT test the database directly (use mocks)\n\nDon't write the implementation yet.\n\n[GREEN]\nThe test is now written. Write the implementation that makes all tests pass. Do not modify the tests.\n\n[REFACTOR]\nThe tests are passing. Refactor the implementation for readability without changing behavior. Run the tests again to confirm.\n\n※ 강화판: 한 세션이 테스트를 쓰고, 다른 세션이 통과시키는 코드를 쓴다(공식 Writer/Reviewer 변형).\n※ 필수 안전장치: \"It is unacceptable to remove or edit tests.\" — 테스트를 지워서 통과시키는 것을 막는다.", "src": "https://dev.to/myougatheaxo/test-driven-development-with-claude-code-write-tests-first-then-make-them-pass-2a6m"}, {"id": "E-04", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 자기교정", "title": "★ 생성 → 리뷰 → 수정 (self-correction chain)", "when": "공식 문서가 '가장 흔한 체이닝 패턴'으로 지목. 각 단계를 별개 호출로 끊어야 효과가 난다.", "text": "[1 생성]\n{작업}에 대한 초안을 작성해줘. 완성도보다 커버리지를 우선해. 빠진 영역이 없게 하고, 확신이 없는 부분은 <uncertain> 태그로 표시해줘.\n\n[2 리뷰 — 별개 호출]\n아래 초안을 다음 기준으로만 평가해줘. 다시 쓰지 말고 평가만 해.\n<criteria>\n1. {기준1 — 예: 사실관계가 인용 출처와 일치하는가}\n2. {기준2 — 예: 요청한 범위를 벗어난 내용이 있는가}\n3. {기준3 — 예: 결론이 근거로부터 실제로 도출되는가}\n</criteria>\n각 항목마다 PASS / FAIL 과 근거를 한 줄씩. FAIL만 수정 지시를 붙여줘. 스타일 취향은 지적하지 마.\n<draft>{1단계 출력}</draft>\n\n[3 수정 — 별개 호출]\n아래 리뷰의 FAIL 항목만 반영해서 초안을 수정해줘. PASS 항목은 건드리지 마. 무엇을 바꿨는지 마지막에 3줄로 요약해줘.\n<draft>{1단계 출력}</draft>\n<review>{2단계 출력}</review>", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/chain-prompts"}, {"id": "E-05", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 평가-개선 루프", "title": "Evaluator–Optimizer (루브릭 기반 반복 개선)", "when": "평가 기준이 명확하고 반복 개선이 값어치를 하는 작업(번역, 카피, 제안서 문구).", "text": "{작업}을 생성-평가 루프로 진행할 거야. 두 역할을 번갈아 수행해.\n\n<rubric>\nR1. {기준1} — 통과 조건: {구체적으로}\nR2. {기준2} — 통과 조건: {구체적으로}\nR3. {기준3} — 통과 조건: {구체적으로}\n</rubric>\n\n루프:\n  [Generator] 산출물 생성 또는 수정\n  [Evaluator] rubric 각 항목에 PASS/FAIL + FAIL이면 \"무엇을 어떻게\" 지시\n             ※ Evaluator는 절대 직접 고치지 마. 지시만 해.\n  [Generator] FAIL 항목만 반영\n\n종료 조건:\n  - 전 항목 PASS → 종료\n  - 3회 반복해도 같은 항목이 FAIL → 멈추고 나에게 물어봐. 루브릭 자체가 틀렸거나 모순됐을 가능성이 크니 그 가설도 같이 말해줘.\n\n매 라운드마다 \"이번에 바뀐 것\"을 3줄로 남겨줘.", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"id": "E-06", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 분기", "title": "Routing (입력을 분류해 다른 처리로 보내기)", "when": "문의 유형·문서 종류가 뚜렷이 갈리고 각각 다르게 다뤄야 할 때.", "text": "아래 입력을 분류만 해. 답변은 하지 마.\n\n<categories>\nA: {범주A 정의} → {후속 처리}\nB: {범주B 정의} → {후속 처리}\nC: {범주C 정의} → {후속 처리}\nD: 위 어디에도 해당 없음 → 사람 에스컬레이션\n</categories>\n\n<input>{입력}</input>\n\n출력 형식:\ncategory: <A|B|C|D>\nconfidence: <0-1>\nreason: <한 줄>\n\nconfidence가 0.7 미만이면 무조건 D로 보내.", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"id": "E-07", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 병렬", "title": "Parallelization — Sectioning (독립 축으로 쪼개 동시 평가)", "when": "한 산출물을 여러 축에서 봐야 할 때. 축이 섞이면 평가가 뭉개진다.", "text": "{대상}을 4개 축으로 병렬 평가할 거야. 각 축은 독립된 서브에이전트로 돌려줘. 서로의 결과를 참조하지 말고, 각자 자기 축만 판단해.\n\n축1 — 사실 정확성: 주장과 근거가 일치하는가\n축2 — 논리 정합성: 결론이 전제로부터 도출되는가\n축3 — 완결성: 요청 범위 중 누락된 부분\n축4 — 리스크: 실행 시 되돌리기 어려운 지점\n\n각 축은 {0-5점 + 근거 3줄 + 가장 큰 문제 1개}만 반환해.\n전부 모이면 축별 점수표를 만들고, 2점 이하 축만 개선안을 제시해줘.", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"id": "E-08", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 병렬", "title": "Parallelization — Voting (같은 일을 관점만 바꿔 여러 번)", "when": "놓치면 안 되는 검토(보안·법무·안전). 다수결로 노이즈를 거른다.", "text": "같은 작업을 서로 다른 관점 3개로 독립 수행해줘. 서로 참조 금지.\n\n관점1: {예 — 보안 엔지니어}\n관점2: {예 — 성능 엔지니어}\n관점3: {예 — 신규 입사자(가독성)}\n\n각각 발견사항 목록을 낸 뒤, 마지막에 합산해줘.\n- 3명 전원 지적: 즉시 수정\n- 2명 지적: 검토 대상\n- 1명만 지적: 참고 (근거가 특별히 강하지 않으면 무시)", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"id": "E-09", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 오케스트레이션", "title": "Orchestrator–Workers (하위 작업을 미리 알 수 없을 때)", "when": "넓은 조사·다파일 변경. 위임 시 objective/format/sources/boundaries 4가지를 다 줘야 중복이 안 생긴다.", "text": "{목표}를 조사할 거야. 너는 오케스트레이터야. 직접 조사하지 마.\n\n1단계 — 분해:\n   목표를 3~5개의 독립적 조사 축으로 쪼개줘. 축끼리 겹치면 안 돼. 겹침이 보이면 경계를 다시 그어. 쪼개기 전에 \"왜 이렇게 나눴는지\"를 먼저 설명해줘.\n\n2단계 — 각 서브에이전트에게 아래를 전부 명시해서 위임:\n   - objective: 이 축에서 답해야 할 질문 (한 문장)\n   - output format: 반환 형식 (예: 발견 5개 + 각각 출처 URL)\n   - sources: 어디를 봐야 하고 어디는 보지 말아야 하는가\n   - boundaries: 이 축에서 다루지 \"않을\" 것 — 다른 축 침범 금지\n\n3단계 — 종합:\n   결과가 모이면 축 간 모순부터 찾아줘. 모순이 있으면 추가 조사가 필요한지 판단하고, 필요하면 그 축만 다시 돌려. 최종 산출 전에 \"어느 축이 근거가 약한지\" 먼저 말해줘.\n\n※ 비용 경고: 멀티에이전트는 일반 대화의 약 15배 토큰을 쓴다. 고가치 작업에만.\n※ 안 맞는 경우: 에이전트 간 공유 컨텍스트가 많이 필요한 도메인(대부분의 코딩 작업 포함).", "src": "https://www.anthropic.com/engineering/multi-agent-research-system"}, {"id": "E-10", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 적대적 검증", "title": "★ Fresh context 레드팀 리뷰 (과잉 지적 방지 조항 포함)", "when": "완료로 치기 전 마지막 관문. 마지막 줄이 없으면 과잉 엔지니어링을 유발한다.", "text": "서브에이전트를 써서 {산출물}을 {기준 문서}에 대조해 리뷰해줘.\n- 모든 요구사항이 실제로 구현/반영됐는가\n- 명시된 엣지케이스에 대응이 있는가\n- 작업 범위 밖이 건드려지지 않았는가\n\n스타일 취향이 아니라 \"빠진 것\"을 보고해. 정확성이나 명시된 요구사항에 영향을 주는 갭만 flag 해.\n\n※ 공식 경고: \"갭을 찾으라고 지시받은 리뷰어는 작업이 멀쩡해도 대개 뭔가를 보고한다. 그게 시키는 일이니까. 모든 지적을 쫓아가면 과잉 엔지니어링으로 이어진다.\"\n※ fresh context가 핵심 — 자기가 방금 쓴 것에 편향되지 않는다.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "E-11", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 지식노동 파이프라인", "title": "리서치 → 분석 → 문서 → 발표자료 (5단계)", "when": "조사량이 한 컨텍스트를 넘고 중간에 방향 확인이 필요한 작업. 이암허브의 사업계획·기술동향 보고서에 그대로 적용된다.", "text": "[0 스코핑]\n{주제}를 조사하려고 해. 조사 시작 전에 나를 인터뷰해줘. 조사 범위, 독자, 의사결정 목적, 제외할 영역, 신뢰할 출처 기준을 물어봐. 뻔한 질문은 하지 마. 끝나면 RESEARCH_BRIEF.md 로 저장해줘.\n\n[1 리서치]\nRESEARCH_BRIEF.md 기준으로 조사해줘. 조사 축을 3~5개로 나누고 각각 서브에이전트에 위임해. 각 서브에이전트에는 objective / output format / sources / boundaries 를 명시해.\n원자료는 findings.md 에 출처 URL과 함께 누적해. 본문에 다 넣지 마.\n\n[2 분석]\nfindings.md 를 읽고 분석해줘. 원문을 통째로 컨텍스트에 올리지 말고 필요한 부분만 참조해.\n- 축 간 모순 지점 먼저\n- 근거가 약한 주장(출처 1개뿐이거나 2차 출처만) 표시\n- \"확실히 아는 것 / 추정하는 것 / 모르는 것\" 3분류\nanalysis.md 로 저장. 아직 문서 쓰지 마.\n\n[3 문서]\nanalysis.md 기반으로 먼저 목차와 각 절의 핵심 주장만 써줘. 내가 승인하기 전에 본문은 쓰지 마.\n(승인 후) 승인된 목차대로 본문을 작성해. 모든 사실 주장에 findings.md 의 출처를 달아. 출처 없는 주장은 쓰지 말고, 꼭 필요하면 [추정]으로 표시해.\n\n[4 발표자료]\n문서를 슬라이드로 옮기지 마. 다시 설계해.\n- 청중이 기억해야 할 메시지 3개를 먼저 정하고 나에게 확인받아\n- 확정 후 슬라이드당 메시지 1개, 슬라이드 제목은 주장문으로(명사구 금지)\n- 근거는 본문 문서 참조로 남기고 슬라이드에는 요약만\n\n[5 레드팀]\n서브에이전트로 발표자료를 RESEARCH_BRIEF.md 에 대조 검토해줘.\n- 원래 의사결정 목적에 답하고 있는가\n- analysis.md 에서 \"근거 약함\"으로 표시된 게 슬라이드에서 단정문이 됐는가\n- 반대 입장이 제기할 가장 강한 반론은\n스타일이 아니라 갭만 보고해.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "E-12", "env": "Cowork", "kind": "흐름", "cat": "E. 흐름 · 데이터 파이프라인", "title": "수집 → 정제 → 시각화 → 보고 (4단계, 승인 게이트 포함)", "when": "대용량 데이터가 컨텍스트를 압도하는 작업. 스마트팜 소득조사·환경데이터 분석에 그대로 쓴다.", "text": "[1 수집]\n{소스}에서 데이터를 수집해 raw/ 에 저장해줘. 수집한 데이터를 컨텍스트에 출력하지 마. 다음만 보고해:\n- 행/열 수, 파일 크기\n- 컬럼명과 각 컬럼의 샘플 3개\n- 결측·이상 의심 지점\n\n[2 정제]\nraw/ 를 정제해 clean/ 으로 만들어줘. 전체를 읽지 말고 head/tail/샘플링으로 파악한 뒤 스크립트를 작성해.\n정제 규칙을 코드로 남기고(cleaning.py), 각 규칙마다 \"몇 행이 영향받았는지\" 로그를 남겨줘.\n데이터를 조용히 버리지 마 — 버린 건 dropped.csv 로 따로 저장.\n정제 전후 행 수 대조표를 먼저 보여주고, 내 승인 후 다음 단계로.\n\n[3 시각화]\n차트를 그리기 전에 \"이 데이터에서 답할 질문 3개\"를 먼저 제안해줘. 내가 고르면 그것만 시각화해.\n각 차트마다: 무엇을 보여주는가 / 무엇을 보여주지 \"않는가\" / 이 차트로 내리면 안 되는 결론\n\n[4 보고]\n보고서를 쓰기 전에 자기검증부터:\n- 본문의 모든 수치가 clean/ 에서 재현되는지 실제로 다시 계산해 대조해줘\n- 불일치가 있으면 보고서를 쓰지 말고 먼저 알려줘\n- 상관관계를 인과로 서술한 문장이 있는지 스스로 점검\n검증 통과 후 보고서 작성. 각 수치 옆에 산출 근거(파일·컬럼·집계방식)를 달아.", "src": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}, {"id": "E-13", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 대규모 마이그레이션", "title": "Fan-out 마이그레이션 (수천 파일)", "when": "같은 변환을 대량 반복할 때. 2~3개로 먼저 검증하고 전체에 돌리는 것이 핵심.", "text": "[1 작업 목록 파일 만들기]\nlist all 2,000 files that need migrating and save the list to files.txt\n\n[2 루프 스크립트 — 헤드리스 모드]\nfor file in $(cat files.txt); do\n  claude -p \"Migrate $file from React to Vue. Return OK or FAIL.\" \\\n    --allowedTools \"Edit,Bash(git commit *)\"\ndone\n\n[3 검증 후 전체 실행]\n처음 2~3개 파일에서 잘못된 점을 보고 프롬프트를 다듬은 뒤 전체에 돌린다.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "E-14", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 대규모 마이그레이션", "title": "Anthropic 공식 마이그레이션 킷 6단계 게이트", "when": "언어·프레임워크 전면 이전. 철학: '코드를 고치는 게 아니라 그 코드를 만들어낸 프로세스를 고친다.'", "text": "Step 0. 00-feasibility.md → 읽기 전용 타당성 판정. \"Don't migrate\"도 정당한 결론.\nStep 1. 3개 산출물 동시 생성\n        - RULEBOOK.md : 번역자가 두 가지로 해석할 수 있는 모든 결정에 단 하나의 정답 부여\n        - Dependency Map : 파일/패키지 단위 순환 탐지 → 작업 순서 결정\n        - inventory.tsv : 소유권/nullability/타입 등 언어별 갭 목록\nStep 2. bakeoff + 파일럿으로 룰북 스트레스 테스트 → 룰 수정안 큐잉\nStep 3. 기계적 큐로 병렬 번역\nStep 4. 컴파일 → 에러를 기계 큐로 뽑아 병렬 수정 → 클린 빌드\nStep 5. hello-world 검증 → 최소 E2E → 실행 가능 바이너리\nStep 6. parity judge로 동작 일치 검증 → 테스트 스위트 통과", "src": "https://github.com/anthropics/code-migration-kit-with-claude-code"}, {"id": "E-15", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 멀티에이전트", "title": "에이전트 팀 3~5명 병렬 운용", "when": "독립적인 관점·모듈이 3개 이상일 때. '집중된 3명이 산만한 5명보다 낫다'가 공식 가이드.", "text": "[다관점 설계]\nI'm designing {대상}. Spawn three teammates to explore this from different angles: one on UX, one on technical architecture, one playing devil's advocate.\n\n[병렬 리뷰]\nSpawn three teammates to review PR #142: one focused on security implications, one checking performance impact, one validating test coverage. Have them each review and report findings.\n\n[경쟁 가설 디버깅 — 서로 반증하게 하기]\nUsers report {증상}. Spawn 5 agent teammates to investigate different hypotheses. Have them talk to each other to try to disprove each other's theories, like a scientific debate. Update the findings doc with whatever consensus emerges.\n\n[게이트 걸기]\nSpawn an architect teammate to refactor {모듈}. Require plan approval before they make any changes. Only approve plans that include test coverage.\n\n[리드가 먼저 코딩 시작하는 것 막기]\nWait for your teammates to complete their tasks before proceeding.\n\n※ 팀메이트는 리드의 대화 이력을 상속하지 않는다. 위임 프롬프트에 맥락을 충분히 실어야 한다.", "src": "https://code.claude.com/docs/en/agent-teams"}, {"id": "E-16", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 멀티에이전트", "title": "Writer / Reviewer 2세션 분리", "when": "에이전트 팀 없이도 되는 가장 값싼 품질 장치. 세션을 두 개 띄우기만 하면 된다.", "text": "[Session A — Writer]\nImplement a rate limiter for our API endpoints.\n\n[Session B — Reviewer, 새 세션]\nReview the rate limiter implementation in @src/middleware/rateLimiter.ts. Look for edge cases, race conditions, and consistency with our existing middleware patterns.\n\n[Session A — Writer]\nHere's the review feedback: [Session B output]. Address these issues.\n\n※ 이유(공식): \"새 컨텍스트는 코드 리뷰를 개선한다. Claude가 방금 자기가 쓴 코드에 편향되지 않기 때문이다.\"\n※ 테스트에도 같은 구조를 쓸 수 있다 — 한 세션이 테스트를 쓰고, 다른 세션이 통과 코드를 쓴다.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "E-17", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 병렬 브랜치", "title": "1 세션 = 1 워크트리 = 1 브랜치 = 1 PR", "when": "여러 기능을 동시에 진행할 때. 한국어 실전 운용 규칙 그대로.", "text": "[세션 A]\n워크트리를 만들어서 작업할게요. 이름은 {render-fix}로 하고요. {렌더링 속도가 느린 원인}을 찾아서 개선해주세요.\n\n[세션 B]\n워크트리 {stock-lib} 만들어서 시작해주세요. {에피소드 간 스톡 이미지를 재활용하는 구조}를 잡아주세요.\n\n[병합]\n두 변경의 의도를 모두 살려서 자연스럽게 하나로 합쳐줘. 판단이 필요한 부분은 코드 읽을 줄 모르는 사람도 알 수 있게 설명해주세요. 합친 뒤 양쪽 기능이 정상 동작하는지 직접 테스트하고 깨진 게 있으면 수정해주세요.\n\n[정리]\nPR 머지됐어요. 이 워크트리랑 브랜치 정리해주세요.\n\n※ 주의: worktree를 과하게 쓰면 잦은 컨텍스트 스위칭이 오히려 품질을 떨어뜨린다.", "src": "https://brunch.co.kr/@yongjinjinipln/257"}, {"id": "E-18", "env": "Code", "kind": "흐름", "cat": "E. 흐름 · 원샷", "title": "PMU 원샷 (Plan Mode + Ultrathink + Auto-Accept)", "when": "5~10분간 자리를 비워도 되는 큰 덩어리 작업. 막히면 디버깅 말고 더 좋은 프롬프트로 재시작.", "text": "1. 터미널이 아니라 마크다운 에디터에서 긴 프롬프트를 완성한다\n2. Shift+Tab 으로 Plan Mode 진입\n3. 프롬프트에 \"ultrathink\" 키워드를 넣는다 (think < think hard < think harder < ultrathink)\n4. 계획 승인 후 auto-accept 로 5~10분 무중단 실행\n5. 막히면 디버깅하지 말고 → 더 나은 프롬프트로 처음부터 재시작\n\n\"Starting from scratch, especially if you elaborate a better, higher quality prompt, is the easiest way to unstuck the agent.\"\n", "src": "https://dev.to/luaroncrew/how-to-one-shot-tasks-with-claude-code-338o"}, {"id": "E-19", "env": "Cowork", "kind": "흐름", "cat": "E. 흐름 · 업무 자동화 성숙도", "title": "수동 실행 → 스킬 저장 → 스케줄 자동화 (3단계 승격)", "when": "반복 업무를 자산으로 바꾸는 표준 경로. Cowork 활용의 핵심 뼈대.", "text": "[1단계 — 수동으로 한 번 제대로 한다]\n{업무}를 해줘. (중간에 수정 요청을 하며 결과를 원하는 수준까지 끌어올린다)\n\n[2단계 — 스킬로 굳힌다]\n지금까지의 과정을 스킬로 만들어줘. 내가 중간에 수정 요청한 부분은 '흔한 실수' 항목으로 따로 넣어줘.\n\n[3단계 — 스케줄로 돌린다]\n매주 {요일} {시간}에 이 스킬로 {업무}를 실행하고 결과를 {위치}에 저장해줘. 실패하면 어디서 멈췄는지 로그를 남겨줘.\n\n※ 1단계를 건너뛰고 바로 스킬을 만들면 거의 실패한다. 한 번 손으로 해봐야 규칙이 나온다.", "src": "https://digit2sight.com/%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%BD%94%EC%9B%8C%ED%81%ACclaude-cowork-%EC%99%84%EB%B2%BD-%EA%B0%80%EC%9D%B4%EB%93%9C-%EA%B0%80%EA%B2%A9%C2%B7%EC%82%AC%EC%9A%A9%EB%B2%95%C2%B7%EC%8B%A4%EC%A0%84/"}, {"id": "E-20", "env": "공통", "kind": "흐름", "cat": "E. 흐름 · 교차검증", "title": "다른 모델과 갑론을박시키기", "when": "한 모델의 편향을 걷어낼 때. 한국어 커뮤니티에서 반복 추천되는 실전 루틴.", "text": "[1] Cowork/Claude로 초안 생성\n[2] 다른 모델에 초안을 넣고: \"이 문서의 사실 오류, 논리 비약, 근거 없는 단정을 찾아줘. 칭찬은 하지 말고 문제만.\"\n[3] Claude에 되돌려: \"다음은 외부 검토 의견이야. 각 지적에 대해 ① 수용 ② 부분 수용 ③ 반박 중 하나로 답하고, 반박이면 근거를 대. 그다음 수용한 것만 반영해 수정본을 써줘.\"\n[4] 2~3회 반복 후 최종본은 Claude에서 정리", "src": "https://www.clien.net/service/board/use/19165111"}, {"id": "F-01", "env": "공통", "kind": "운영", "cat": "F. 운영 · 컨텍스트 관리", "title": "★ 2회 교정 규칙 — 세 번째는 고치지 말고 리셋하라", "when": "같은 문제를 두 번 넘게 지적했을 때. 직관에 반하지만 공식 문서가 단정하는 원칙.", "text": "공식 원문:\n\"If you've corrected Claude more than twice on the same issue in one session, the context is cluttered with failed approaches. Run /clear and start fresh with a more specific prompt that incorporates what you learned. A clean session with a better prompt almost always outperforms a long session with accumulated corrections.\"\n\n실행:\n1. /clear (또는 새 대화 시작)\n2. 아래 형식으로 새 프롬프트를 쓴다\n\n이전 시도에서 확인된 사실만 전제로 깔고 다시 시작할게.\n<확인된_사실>\n- {실제로 검증된 것}\n</확인된_사실>\n<막다른_길>\n- {접근 A} — {실패한 정확한 이유}\n- {접근 B} — {실패한 정확한 이유}\n※ 이 둘은 다시 시도하지 마.\n</막다른_길>\n<이번_제약>\n- {새로 확정한 제약}\n</이번_제약>\n이 전제 위에서 접근법부터 제안해줘. 구현은 내가 승인한 뒤에.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "F-02", "env": "공통", "kind": "운영", "cat": "F. 운영 · 컨텍스트 관리", "title": "/compact 에 보존 대상 명시하기", "when": "압축하면서 중요한 게 날아가는 걸 막을 때.", "text": "/compact 다음을 반드시 보존해줘: 수정한 파일 전체 목록, 확정된 아키텍처 결정, 아직 못 고친 버그, 테스트 실행 명령어. 탐색 과정에서 읽었던 파일 내용과 폐기된 접근법은 버려도 돼.\n\n※ CLAUDE.md / 폴더 지침에 박아두는 상시 버전:\nWhen compacting, always preserve the full list of modified files and any test commands", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "F-03", "env": "공통", "kind": "운영", "cat": "F. 운영 · 핸드오프", "title": "★ 세션 종료 핸드오프 5섹션", "when": "오늘 작업을 내일 이어갈 때. 마지막 두 줄('이 대화를 못 봤다고 가정')이 문서 품질을 좌우한다.", "text": "지금 세션을 중단할 거야. HANDOFF.md 를 작성해줘. 다음 5개 섹션을 정확히 지켜:\n\n## 1. What happened\n이번 세션에서 실제로 완료한 것과 내린 결정. \"시도했다\"가 아니라 \"됐다\"만. 결정에는 왜 그렇게 정했는지 이유도 한 줄씩.\n\n## 2. Where things live\n변경된 파일의 절대 경로 목록. 각 파일에 무엇을 했는지 한 줄.\n\n## 3. Verification done\n무엇을 테스트했고 무엇이 통과했는가. 그리고 ★무엇을 테스트하지 \"않았는가\"★ — 이걸 빠뜨리지 마.\n\n## 4. State\n현재 상태 (브랜치/커밋, 또는 문서 버전과 미반영 피드백).\n\n## 5. Open follow-ups\n번호를 붙인 구체적 재개 지점. \"리팩토링 필요\" 같은 모호한 항목 금지. \"파일 X의 함수 Y를 Z 때문에 수정해야 함\" 수준으로.\n\n내가 이 문서만 읽고 내일 다른 세션에서 이어갈 수 있어야 해. 이 대화를 못 봤다고 가정하고 써.", "src": "https://www.nathanonn.com/claude-code-handoff-doc-skill/"}, {"id": "F-04", "env": "공통", "kind": "운영", "cat": "F. 운영 · 핸드오프", "title": "재개 프롬프트 (상태 검증 먼저)", "when": "핸드오프 문서로 다음 날 시작할 때. 바로 작업시키면 낡은 전제 위에서 출발한다.", "text": "HANDOFF.md 를 읽고 이어서 작업할 거야. 바로 시작하지 마.\n\n먼저:\n1. HANDOFF.md 의 \"State\"가 현재 실제 상태와 일치하는지 확인해줘\n2. 불일치가 있으면 그것부터 보고해\n3. \"Open follow-ups\" 중 첫 항목이 여전히 유효한지(이미 됐거나, 전제가 바뀌지 않았는지) 확인해줘\n\n확인이 끝나면 무엇부터 할지 제안하고 내 승인을 기다려.", "src": "https://code.claude.com/docs/en/common-workflows"}, {"id": "F-05", "env": "공통", "kind": "운영", "cat": "F. 운영 · 외부 메모리", "title": "다중 세션 메모리 구조 세우기", "when": "여러 날에 걸친 프로젝트 시작 시 1회. '완료 표시는 검증됐을 때만'이 핵심 규칙.", "text": "[프로젝트 시작 시 1회]\n본격 작업 전에 메모리 구조부터 세우자. 다음 파일을 만들어줘:\n1. progress.md — 완료된 것 / 다음 할 것\n2. checklist.md — 전체 항목 목록과 범위 정의\n3. setup.md — 프로젝트 시작 방법과 환경 정보\n\n★규칙★: 항목을 \"완료\"로 표시하는 건 작업했을 때가 아니라 end-to-end 검증이 끝났을 때만이야. 이걸 checklist.md 맨 위에 적어둬.\n\n[이후 매 세션]\n시작: 위 파일들을 먼저 읽고 프로젝트 상태를 복원해줘.\n종료: progress.md 를 갱신해줘 — 완료한 것과 남은 것.", "src": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool"}, {"id": "F-06", "env": "공통", "kind": "운영", "cat": "F. 운영 · 실패 복구", "title": "막혔을 때 — 재시도 금지, 진단부터", "when": "같은 시도를 반복하며 제자리걸음할 때.", "text": "멈춰. 같은 걸 반복하고 있어. 다시 시도하지 말고 진단부터 해줘.\n\n1. 지금까지 시도한 접근을 나열하고, 각각 정확히 어디서 실패했는지 (증상 말고 실패 지점)\n2. 그 접근들이 공유하는 \"암묵적 전제\"가 뭐야?\n3. 그 전제 중 틀렸을 가능성이 가장 높은 건?\n4. 전제가 틀렸다면 대안 접근 2개는?\n\n아직 실행하지 마. 위 4개에만 답해.\n\nIf the task is unreasonable or infeasible, or if any of the tests are incorrect, please inform me rather than working around them. When encountering obstacles, do not use destructive actions as a shortcut.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "F-07", "env": "공통", "kind": "운영", "cat": "F. 운영 · 실패 복구", "title": "무한 탐색 방지 (읽기 예산 걸기)", "when": "'조사해줘' 한마디에 수백 파일을 읽어 컨텍스트가 폭발할 때.", "text": "{주제}를 조사해줘. 단, 다음 예산 안에서:\n- 최대 {N}개 파일까지만 읽어\n- 그 안에 답을 못 찾으면 멈추고, 어디를 더 봐야 할지 나에게 물어봐\n- 탐색은 서브에이전트로 격리하고, 나에게는 결론만 보고해\n\n읽기 시작하기 전에 \"어떤 파일을 왜 읽을 건지\" 목록을 먼저 보여줘.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "F-08", "env": "공통", "kind": "운영", "cat": "F. 운영 · 자기검증", "title": "주장이 아니라 증거를 요구하기", "when": "'완료했습니다'만 오고 실제로는 안 됐을 때.", "text": "작업이 끝나면 \"완료했습니다\"라고 쓰지 마. 대신 다음 증거를 그대로 붙여줘.\n- 실행한 명령어와 그 출력 전문\n- 통과한 항목과 실패한 항목의 개수\n- 검증하지 못한 부분과 그 이유\n\n검증하지 못한 게 있으면 숨기지 말고 명시해.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "F-09", "env": "Cowork", "kind": "운영", "cat": "F. 운영 · Cowork 세팅", "title": "Cowork 폴더 위생 규칙", "when": "Cowork를 처음 세팅할 때. 사고를 미리 막는 4가지.", "text": "① 전용 작업 폴더를 만든다 (예: Documents\\Cowork-Playground) — 루트 드라이브 선택 금지\n② 폴더명은 영문으로 (한글 경로 버그 회피)\n③ 폴더에 CLAUDE.md(폴더 지침)를 두고 상시 규칙을 적는다:\n   - 파일 삭제/덮어쓰기 전에 변경 내용을 보여주고 확인을 기다릴 것\n   - 자료에 없는 수치·담당자·일정은 '확인 필요'로 표시할 것\n   - 산출물은 output/ 아래에 날짜_제목 형식으로 저장할 것\n④ 커넥터는 필요한 것만 연결한다 (Gmail → Drive → Calendar → Notion 순 권장)", "src": "https://www.aiground.co.kr/claude-cowork-beginners-guide/"}, {"id": "F-10", "env": "공통", "kind": "운영", "cat": "F. 운영 · 안티패턴", "title": "공식이 지목한 5대 실패 패턴과 처방", "when": "세션이 자꾸 산으로 갈 때 자가진단표로 쓴다.", "text": "① The kitchen sink session — 한 작업 하다 딴 걸 묻고 돌아옴\n   → 무관한 작업 사이에는 /clear (Chat이면 새 대화)\n\n② Correcting over and over — 고쳐도 계속 틀림\n   → 2회 실패하면 /clear + 배운 걸 반영한 더 나은 초기 프롬프트\n\n③ The over-specified CLAUDE.md — 규칙이 있는데 무시함\n   → 가차없이 가지치기. 지시 없이도 잘하면 삭제하거나 훅으로 전환\n   → \"Bloated CLAUDE.md files cause Claude to ignore your actual instructions!\"\n\n④ The trust-then-verify gap — 그럴듯한데 엣지케이스가 깨짐\n   → 항상 검증 수단 제공. \"If you can't verify it, don't ship it.\"\n\n⑤ The infinite exploration — 범위 없는 조사로 컨텍스트 폭발\n   → 범위를 좁히거나 서브에이전트로 격리", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "F-11", "env": "공통", "kind": "운영", "cat": "F. 운영 · 안티패턴", "title": "2026년에 '지우라'고 명시된 옛날 프롬프트들", "when": "예전에 만든 프롬프트를 최신 모델로 옮길 때. 마이그레이션의 첫 작업은 추가가 아니라 제거다.", "text": "삭제 대상 (Opus 5 기준 공식 지침):\n- \"double-check your answer\" / \"re-verify before responding\"\n  → Opus 5는 시키지 않아도 자기 검증을 한다. 비용만 늘고 결과는 나빠진다. 재작성이 아니라 삭제.\n- \"CRITICAL: You MUST use this tool when...\"\n  → 최신 모델은 시스템 프롬프트에 더 민감해져 오히려 과트리거한다. \"Use this tool when...\" 수준으로 낮춘다.\n- \"include a final verification step\" 류의 상시 검증 지시\n- 수동 chain-of-thought(<thinking> 태그 강제) — thinking 기능으로 대체\n- prefill(assistant 메시지 미리 채우기) — Claude 4.6 이상에서 400 에러\n- thinking budget_tokens 지정 — Claude 4.7 이상에서 400 에러\n\n- 코드 리뷰에서 \"only report high-severity issues\" / \"be conservative\"\n  → 문자 그대로 따라서 덜 보고한다. 전부 보고시키고 별도 패스에서 필터링하라.", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5"}, {"id": "G-01", "env": "Code", "kind": "자산", "cat": "G. 자산화 · CLAUDE.md", "title": "공식 최소 CLAUDE.md (이게 정답 크기다)", "when": "처음 만들 때. /init 으로 초안을 만든 뒤 이 수준으로 깎는다. 목표 200줄 이하.", "text": "# Code style\n- Use ES modules (import/export) syntax, not CommonJS (require)\n- Destructure imports when possible (eg. import { foo } from 'bar')\n\n# Workflow\n- Be sure to typecheck when you're done making a series of code changes\n- Prefer running single tests, and not the whole test suite, for performance\n\n★ 판별 질문: 한 줄마다 \"이걸 지우면 Claude가 실수할까?\" 아니면 지운다.", "src": "https://code.claude.com/docs/en/memory"}, {"id": "G-02", "env": "Code", "kind": "자산", "cat": "G. 자산화 · CLAUDE.md", "title": "CLAUDE.md 포함/제외 기준표", "when": "무엇을 넣을지 판단할 때.", "text": "[넣을 것]\n- Claude가 추측할 수 없는 bash 명령어\n- 기본값과 다른 코드 스타일 규칙\n- 테스트 방법·선호 테스트 러너\n- 저장소 에티켓 (브랜치 명명, PR 관례)\n- 프로젝트 고유 아키텍처 결정\n- 개발 환경 특이사항 (필수 환경변수)\n- 흔한 함정, 비자명한 동작\n\n[빼야 할 것]\n- 코드를 읽으면 알 수 있는 것\n- Claude가 이미 아는 표준 관례\n- 상세 API 문서 (링크로 대체)\n- 자주 바뀌는 정보\n- 긴 설명이나 튜토리얼\n- 파일별 코드베이스 설명\n- \"clean code를 작성하라\" 같은 자명한 관행\n\n※ 스타일 가이드는 CLAUDE.md가 아니라 린터에 맡겨라.", "src": "https://code.claude.com/docs/en/best-practices"}, {"id": "G-03", "env": "Code", "kind": "자산", "cat": "G. 자산화 · CLAUDE.md", "title": "Karpathy 계열 4원칙 (드롭인 전문)", "when": "프로젝트 무관하게 LLM 코딩 실수를 줄이는 범용 규칙. 그대로 복사해 병합한다.", "text": "## 1. Think Before Coding\n**Don't assume. Don't hide confusion. Surface tradeoffs.**\n- State your assumptions explicitly. If uncertain, ask.\n- If multiple interpretations exist, present them - don't pick silently.\n- If a simpler approach exists, say so. Push back when warranted.\n- If something is unclear, stop. Name what's confusing. Ask.\n\n## 2. Simplicity First\n**Minimum code that solves the problem. Nothing speculative.**\n- No features beyond what was asked.\n- No abstractions for single-use code.\n- No \"flexibility\" that wasn't requested.\n- No error handling for impossible scenarios.\n- If you write 200 lines and it could be 50, rewrite it.\n\n## 3. Surgical Changes\n**Touch only what you must. Clean up only your own mess.**\n- Don't \"improve\" adjacent code, comments, or formatting.\n- Don't refactor things that aren't broken.\n- Match existing style, even if you'd do it differently.\n- Remove imports/variables that YOUR changes made unused; don't remove pre-existing dead code.\nThe test: Every changed line should trace directly to the user's request.\n\n## 4. Goal-Driven Execution\n**Define success criteria. Loop until verified.**\n- \"Add validation\" → \"Write tests for invalid inputs, then make them pass\"\n- \"Fix the bug\" → \"Write a test that reproduces it, then make it pass\"\nFor multi-step tasks, state a brief plan: [Step] → verify: [check]", "src": "https://github.com/multica-ai/andrej-karpathy-skills/blob/main/CLAUDE.md"}, {"id": "G-04", "env": "Cowork", "kind": "자산", "cat": "G. 자산화 · 폴더 지침", "title": "Cowork 폴더 지침 템플릿 (업무용 CLAUDE.md)", "when": "Cowork에 폴더를 연결할 때 그 안에 두는 상시 규칙 파일.", "text": "# 이 폴더 작업 규칙\n\n## 산출물\n- 결과물은 `output/` 아래 `YYYYMMDD_제목.확장자` 로 저장\n- 원본 파일은 절대 덮어쓰지 말 것. 수정본은 `_v2` 접미사로\n\n## 안전\n- 파일 삭제/이동/덮어쓰기 전에 목록을 보여주고 확인을 기다릴 것\n- 삭제는 절대 자동 실행하지 말 것\n\n## 사실성\n- 자료에 없는 수치·담당자·일정은 만들지 말고 '확인 필요'로 표시\n- 모든 수치에는 출처(파일명·시트·행)를 병기\n\n## 문체\n- [해요체/합쇼체], 과장 표현 금지, 한 문단 3~5문장\n\n## 자주 쓰는 양식\n- 보고서 양식: `templates/report.docx`\n- 제안서 양식: `templates/proposal.hwp`", "src": "https://support.claude.com/en/articles/13345190-get-started-with-claude-cowork"}
