, {"id": "G-05", "env": "Code", "kind": "자산", "cat": "G. 자산화 · 슬래시 커맨드", "title": "배포 전 점검 커맨드 (/deploy)", "when": "반복 체크리스트를 명령 하나로 굳힐 때. .claude/commands/deploy.md 에 저장.", "text": "Pre-deployment checklist for $ARGUMENTS (or main branch if not specified):\n\n1. Run the test suite and confirm all tests pass\n2. Check for any console.log statements that shouldn't go to production\n3. Verify environment variables are documented in .env.example\n4. Check that package.json version was bumped if needed\n5. Look for any TODO comments that should be resolved before shipping\n6. Summarize what changed and whether it's safe to deploy\n\nIf anything fails, stop and explain what needs to be fixed first.", "src": "https://dev.to/subprime2010/claude-code-custom-slash-commands-build-your-own-deploy-review-test-1ifc"}, {"id": "G-06", "env": "Code", "kind": "자산", "cat": "G. 자산화 · 슬래시 커맨드", "title": "컨텍스트 자동 주입 커맨드 문법", "when": "명령 실행 시점의 git 상태 등을 프롬프트에 자동으로 넣을 때.", "text": "---\ndescription: Create a git commit with a conventional message\nallowed-tools: Bash(git add:*), Bash(git commit:*)\nargument-hint: [message]\nmodel: haiku\n---\n\n# Commit Changes\n\n<git_diff>\n!`git diff --cached`\n</git_diff>\n\nCreate a commit message following Conventional Commits.\nIf $ARGUMENTS is provided, use it as the commit message.\n\n※ 문법 포인트\n!`명령`     → 실행 결과를 프롬프트에 주입\n$ARGUMENTS  → 인자 치환 ($1, $2 로 개별 접근)\nmodel:      → 간단한 커맨드는 저비용 모델로", "src": "https://alexop.dev/posts/claude-code-slash-commands-guide/"}, {"id": "G-07", "env": "Code", "kind": "자산", "cat": "G. 자산화 · 스킬", "title": "워크플로 스킬 = 슬래시 커맨드 (수동 전용)", "when": "부작용이 있는 워크플로를 자동 발동 없이 수동으로만 쓰게 할 때.", "text": "---\nname: fix-issue\ndescription: Fix a GitHub issue\ndisable-model-invocation: true\n---\nAnalyze and fix the GitHub issue: $ARGUMENTS.\n\n1. Use `gh issue view` to get the issue details\n2. Understand the problem described in the issue\n3. Search the codebase for relevant files\n4. Implement the necessary changes to fix the issue\n5. Write and run tests to verify the fix\n6. Ensure code passes linting and type checking\n7. Create a descriptive commit message\n8. Push and create a PR\n\n※ 커스텀 커맨드는 스킬로 통합됐다. .claude/commands/x.md 와 .claude/skills/x/SKILL.md 는 둘 다 /x 를 만든다.", "src": "https://code.claude.com/docs/en/skills"}, {"id": "G-08", "env": "공통", "kind": "자산", "cat": "G. 자산화 · 스킬", "title": "SKILL.md 작성 규격 (description이 전부다)", "when": "스킬을 만들 때. description은 Claude가 100개 넘는 스킬 중에서 고르는 유일한 단서다.", "text": "---\nname: processing-pdfs          # 소문자·숫자·하이픈, 64자 이내, 동명사형 권장\ndescription: Extracts text and tables from PDF files, fills forms, and merges documents. Use when working with PDF files or when the user mentions PDFs, forms, or document extraction.\n---\n\n# PDF Processing\n\n## Quick start\n[가장 흔한 사용법을 코드/절차로 바로]\n\n## Advanced\n**Form filling**: See [FORMS.md](FORMS.md)\n**API reference**: See [REFERENCE.md](REFERENCE.md)\n\n★ description 공식 = [동사구: 무엇을 하는가] + \"Use when ~\" [구체적 트리거: 파일 유형·사용자 표현·상황]\n★ 반드시 3인칭으로. \"I can help you...\" / \"You can use this to...\" 금지.\n★ 나쁜 예: \"Helps with documents\" / \"Processes data\"\n★ 본문 500줄 이하. 참조는 1단계 깊이까지만 (중첩 참조 금지).\n★ 3계층 로딩: 메타데이터(항상, ~100토큰) → 본문(트리거 시) → 참조파일(필요할 때만, 미사용 시 0토큰)", "src": "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"}, {"id": "G-09", "env": "공통", "kind": "자산", "cat": "G. 자산화 · 스킬", "title": "자유도 설계 — 좁은 다리인가 열린 들판인가", "when": "스킬을 얼마나 구체적으로 쓸지 정할 때.", "text": "[낮은 자유도 — \"양쪽이 절벽인 좁은 다리\"]\n취약하고 순서가 중요한 작업. 정확한 명령을 박아둔다.\n  Run exactly this script:\n  python scripts/migrate.py --verify --backup\n  Do not modify the command or add additional flags.\n\n[중간 자유도]\n선호 패턴은 있으나 변형 허용. 파라미터가 있는 의사코드/스크립트.\n  def generate_report(data, format=\"markdown\", include_charts=True):\n\n[높은 자유도 — \"위험 없는 열린 들판\"]\n맥락이 최선을 결정하는 작업(코드 리뷰, 글 다듬기). 방향만 준다.\n  1. Analyze the code structure and organization\n  2. ...", "src": "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"}, {"id": "G-10", "env": "Code", "kind": "자산", "cat": "G. 자산화 · 서브에이전트", "title": "코드 리뷰어 서브에이전트 (공식 전문)", "when": ".claude/agents/code-reviewer.md 에 저장. 우선순위 3단 분류가 실무 효용의 핵심.", "text": "---\nname: code-reviewer\ndescription: Expert code review specialist. Proactively reviews code for quality, security, and maintainability. Use immediately after writing or modifying code.\ntools: Read, Grep, Glob, Bash\nmodel: inherit\n---\n\nYou are a senior code reviewer ensuring high standards of code quality and security.\n\nWhen invoked:\n1. Run git diff to see recent changes\n2. Focus on modified files\n3. Begin review immediately\n\nReview checklist:\n- Code is clear and readable\n- Functions and variables are well-named\n- No duplicated code\n- Proper error handling\n- No exposed secrets or API keys\n- Input validation implemented\n- Good test coverage\n- Performance considerations addressed\n\nProvide feedback organized by priority:\n- Critical issues (must fix)\n- Warnings (should fix)\n- Suggestions (consider improving)\n\nInclude specific examples of how to fix issues.", "src": "https://code.claude.com/docs/en/sub-agents"}, {"id": "G-11", "env": "Code", "kind": "자산", "cat": "G. 자산화 · 서브에이전트", "title": "디버거 서브에이전트 (근본원인 전문)", "when": "에러·테스트 실패 전담. '최소 수정'과 '재발 방지'가 포인트.", "text": "---\nname: debugger\ndescription: Debugging specialist for errors, test failures, and unexpected behavior. Use proactively when encountering any issues.\ntools: Read, Edit, Bash, Grep, Glob\n---\n\nYou are an expert debugger specializing in root cause analysis.\n\nWhen invoked:\n1. Capture error message and stack trace\n2. Identify reproduction steps\n3. Isolate the failure location\n4. Implement minimal fix\n5. Verify solution works\n\nFor each issue, provide:\n- Root cause explanation\n- Evidence supporting the diagnosis\n- Specific code fix\n- Testing approach\n- Prevention recommendations\n\nFocus on fixing the underlying issue, not the symptoms.", "src": "https://code.claude.com/docs/en/sub-agents"}, {"id": "G-12", "env": "Code", "kind": "자산", "cat": "G. 자산화 · 훅", "title": "편집 후 자동 포맷 훅 (권고가 아니라 강제)", "when": "'매번 반드시' 일어나야 하는 일. CLAUDE.md 지시는 권고, 훅은 결정론적이다.", "text": "{\n  \"hooks\": {\n    \"PostToolUse\": [\n      {\n        \"matcher\": \"Edit|Write\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"jq -r '.tool_input.file_path' | xargs npx prettier --write\"\n          }\n        ]\n      }\n    ]\n  }\n}\n\n※ 훅 자체를 Claude에게 쓰게 해도 된다: \"Write a hook that runs eslint after every file edit.\"\n※ 컴팩션으로 중요 정보가 날아가는 걸 막으려면 SessionStart 훅에 compact matcher를 걸어 핵심 컨텍스트를 재주입한다.", "src": "https://code.claude.com/docs/en/hooks-guide"}];
const ENVS = ["전체", "공통", "Chat", "Cowork", "Code"], KINDS = ["전체", "단위", "흐름", "운영", "자산"], GROUPS = ["A. 기반문법", "B. Chat", "C. Cowork", "D. Code", "E. 흐름", "F. 운영", "G. 자산화"];
let fEnv='전체', fKind='전체', fGrp='전체', q='';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(s,term){ if(!term) return s;
  try{ return s.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }
  catch(e){ return s; } }

function chips(id, list, cur, cb){
  const el=document.getElementById(id); el.innerHTML='';
  list.forEach(v=>{const b=document.createElement('button');
    b.className='chip'+(v===cur?' on':''); b.textContent=v;
    b.onclick=()=>{cb(v);render();}; el.appendChild(b);});
}
function render(){
  chips('fenv',ENVS,fEnv,v=>fEnv=v);
  chips('fkind',KINDS,fKind,v=>fKind=v);
  chips('fgrp',['전체'].concat(GROUPS),fGrp,v=>fGrp=v);
  const term=q.trim().toLowerCase();
  const rows=DATA.filter(p=>{
    if(fEnv!=='전체'&&p.env!==fEnv) return false;
    if(fKind!=='전체'&&p.kind!==fKind) return false;
    if(fGrp!=='전체'&&p.cat.split(' · ')[0]!==fGrp) return false;
    if(!term) return true;
    return (p.id+' '+p.title+' '+p.when+' '+p.text+' '+p.cat).toLowerCase().includes(term);
  });
  document.getElementById('cnt').textContent=rows.length+' / '+DATA.length+'개';
  const out=document.getElementById('out');
  if(!rows.length){out.innerHTML='<div class="empty">일치하는 프롬프트가 없습니다.</div>';return;}
  let h='',last='';
  rows.forEach(p=>{
    if(p.cat!==last){h+='<div class="grp">'+esc(p.cat)+'</div>';last=p.cat;}
    const open = term ? ' open':'';
    h+='<div class="card'+open+'" data-id="'+p.id+'">'
      +'<div class="chead" onclick="this.parentNode.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span>'
      +'<span class="cid">'+p.id+'</span>'
      +'<span class="ctitle">'+hl(esc(p.title),term)+'</span>'
      +'<span class="tags"><span class="tag">'+p.env+'</span><span class="tag">'+p.kind+'</span></span>'
      +'</div>'
      +'<div class="when">'+hl(esc(p.when),term)+'</div>'
      +'<div class="body"><pre id="p_'+p.id+'">'+hl(esc(p.text),term)+'</pre>'
      +'<div class="foot"><button class="copy" onclick="cp(this,\''+p.id+'\')">복사</button>'
      +'<a class="src" href="'+p.src+'" target="_blank" rel="noopener">'+p.src+'</a></div></div></div>';
  });
  out.innerHTML=h;
}
function cp(btn,id){
  const p=DATA.find(x=>x.id===id);
  navigator.clipboard.writeText(p.text).then(()=>{
    btn.textContent='복사됨 ✓'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done');},1400);
  });
}
function setAll(open){document.querySelectorAll('.card').forEach(c=>c.classList.toggle('open',open));}
function copyVisible(){
  const ids=[...document.querySelectorAll('.card')].map(c=>c.dataset.id);
  const txt=ids.map(i=>{const p=DATA.find(x=>x.id===i);
    return '## ['+p.id+'] '+p.title+'\n언제: '+p.when+'\n\n'+p.text+'\n\n출처: '+p.src;}).join('\n\n---\n\n');
  navigator.clipboard.writeText(txt).then(()=>alert(ids.length+'개 프롬프트를 복사했습니다.'));
}
function toggleTheme(){
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='light' ? 'dark':'light';
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
render();
</script>
</body>
